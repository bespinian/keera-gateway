# What a tag produces: the image a deployment runs, an SBOM of what is inside
# it, the keera command for Linux, macOS and Windows, and a provenance
# attestation saying where each came from.
#
# The attestation is the reason this build happens here rather than on a
# workstation. actions/attest-build-provenance signs a statement naming the
# workflow, repository and commit that produced each file, with GitHub's key
# rather than ours. An image built on a laptop can claim the same thing and
# nobody downstream can check it.
#
# The build itself is in release-build.yml, a reusable workflow, so the
# signature names that file. How it keeps the build from forging its own
# provenance, which is what SLSA Build L3 asks, is explained there.
#
# It drives the same `make` targets a developer runs, with GATEWAY_IMAGE pointed
# at the registry instead of localhost, so there is one definition of how the
# image is built and CI cannot quietly build a different one.
name: Release

on:
  push:
    tags: ["v*"]

# The most any job in release-build.yml may have. Each job there asks for only
# what it needs.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
