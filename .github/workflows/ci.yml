# Every commit must be formatted, pass the linters, build, and pass both halves
# of the test suite.
#
# The halves are separate jobs. The unit tests need nothing and answer in under
# a minute. The integration tests need Postgres and Redis to cover what no fake
# does: the schema and queries, Postgres notifications, and the Redis Lua. They
# skip silently without the KEERA_TEST_* variables, so they get a job that sets
# them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to a branch cancels the run for the previous one. Not on main, so
# every commit there keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The gateway builds without cgo, so the tests do too. The race detector needs
  # it, so the steps that use it turn it back on.
  CGO_ENABLED: "0"

jobs:
  check:
    name: Format, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before the linters: formatting is a one-command fix, and a lint report on
      # a file about to be reformatted is not worth reading.
      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Pinned, so a linter release cannot turn an untouched commit red.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      # The fastest way to find out that a platform-specific file does not
      # compile.
      - name: Build
        run: make build

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The panel's JavaScript has no build step to catch a syntax error.
      - name: Check the panel's JavaScript
        run: make check-js

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The packages that need a service skip here; the job below covers them.
      - name: Test
        run: make test
        env:
          CGO_ENABLED: "1"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "1"
      KEERA_TEST_DATABASE_URL: postgres://keera:keera@127.0.0.1:5432/keera_test?sslmode=disable
      KEERA_TEST_REDIS_URL: redis://127.0.0.1:6379/0

    # The same major versions the Makefile uses, pinned so an upstream change
    # does not look like a change in this repository broke CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keera
          POSTGRES_PASSWORD: keera
          POSTGRES_DB: keera_test
        ports:
          - 5432:5432
        # Otherwise the first test can connect before Postgres listens, which
        # fails about one run in three.
        options: >-
          --health-cmd "pg_isready -U keera -d keera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The same target a developer runs. With both variables set it uses the
      # services above and starts nothing.
      - name: Test
        run: make test-integration

      # These tests skip without the two variables, so a typo in either would
      # give a green job that ran nothing. This checks that they ran.
      - name: Confirm the integration tests actually ran
        run: |
          if go test -count=1 -run TestMigrateIsIdempotentAndSafeInParallel -v ./internal/store/ 2>&1 | grep -q SKIP; then
            echo "the integration tests skipped: the database was not reachable" >&2
            exit 1
          fi
          if go test -count=1 -run TestRedisSpendsOneAllowanceAcrossReplicas -v ./internal/ratelimit/ 2>&1 | grep -q SKIP; then
            echo "the integration tests skipped: Redis was not reachable" >&2
            exit 1
          fi
