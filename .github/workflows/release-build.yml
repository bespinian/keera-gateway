# How a release is built and attested. release.yml calls this on a `v*` tag;
# it has no trigger of its own.
#
# Laid out for SLSA Build L3: the build cannot forge its own provenance.
#
# - The build jobs run our code and get no id-token permission. Only the
#   provenance jobs get one, and they check out nothing and run only GitHub's
#   actions, signing the digest and archives they are handed.
# - As a reusable workflow, the signature names this file, not the caller.
#   `gh attestation verify --signer-workflow` checks for it.
name: Release build

on:
  workflow_call:

permissions: {}

jobs:
  image:
    name: Image and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Written here, so the image build stays offline.
      - name: Vendor dependencies
        run: go mod vendor

      # ghcr.io needs a lowercase path, and owner names may not be.
      - name: Name the image
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/keera-gateway" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/$owner/keera-gateway:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # `sbom` depends on `image`, so it describes the image this job pushes.
      # VERSION is stamped in, as the build context has no .git.
      - name: Build the image and its SBOM
        run: make sbom GATEWAY_IMAGE='${{ steps.image.outputs.ref }}' VERSION="$GITHUB_REF_NAME"

      # The attestation's subject must be the digest: a tag can be moved later.
      - name: Push
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push '${{ steps.image.outputs.ref }}' --digestfile=digest.txt
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/sbom/keera-gateway.cdx.json
          if-no-files-found: error

  image-provenance:
    name: Image provenance
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write # to push the attestation next to the image
      id-token: write # the OIDC token the attestation is signed against
      attestations: write # the attestation itself
      artifact-metadata: write # the storage record for the pushed image
    steps:
      # The attestation step reads docker's credentials to reach the registry.
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.image.outputs.name }}
          subject-digest: ${{ needs.image.outputs.digest }}
          # Also stored next to the image, so it can be verified from the image
          # alone.
          push-to-registry: true

  cli:
    name: CLI archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The notices file is read from the vendor tree, like the image's.
      - name: Vendor dependencies
        run: go mod vendor

      - name: Build the archives
        run: make dist VERSION="$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: build/dist/
          if-no-files-found: error

  cli-provenance:
    name: CLI provenance
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token the attestation is signed against
      attestations: write # the attestation itself
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: build/dist

      # One subject per archive, so a single download can be verified.
      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/dist/*.tar.gz

  # Last, so a release never shows files that have no provenance yet.
  publish:
    name: Publish the release
    needs: [image-provenance, cli-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: build/sbom

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: build/dist

      # A tag pushed from a workstation has no release yet; one from the web
      # does.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            build/sbom/keera-gateway.cdx.json build/dist/* \
          || gh release upload "$GITHUB_REF_NAME" --clobber \
            build/sbom/keera-gateway.cdx.json build/dist/*
