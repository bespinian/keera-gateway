# Weekly and grouped per ecosystem, so updates come as a few pull requests.
# Security updates are not grouped and arrive at once.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The gateway's build stage and Keera Decider's.
  - package-ecosystem: docker
    directories: ["/", "/compose/decider"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
