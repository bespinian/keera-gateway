name: keera

# llama.cpp, vLLM and laya-serve all answer /health on port 8000.
x-http-health: &http-health
  - CMD
  - python3
  - -c
  - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")

services:
  keera-gateway:
    build:
      context: ..
      dockerfile: Containerfile
    image: localhost/keera-gateway:latest
    restart: unless-stopped
    ports:
      # One port serves everything: the panel at /, inference under /api, the
      # control API under /control, and sandbox attach under /sandbox.
      #
      # Bound to loopback unless KEERA_BIND says otherwise. Beyond a
      # development machine, put a TLS proxy in front.
      - "${KEERA_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # ",z" relabels for SELinux hosts; harmless elsewhere.
      - ./models.yaml:/etc/keera/models.yaml:ro,z
      - ./sandboxes.yaml:/etc/keera/sandboxes.yaml:ro,z
    # Every setting in .env reaches the gateway. docs/install.md explains them.
    env_file: .env
    # These win over .env.
    environment:
      KEERA_DATABASE_URL: postgres://keera:keera@keera-db:5432/keera?sslmode=disable
      KEERA_OPERATOR_KEY: ${KEERA_OPERATOR_KEY:?set KEERA_OPERATOR_KEY in .env - see .env.example}
      KEERA_SECRET_KEY: ${KEERA_SECRET_KEY:?set KEERA_SECRET_KEY in .env - see .env.example}
      KEERA_MODELS_FILE: /etc/keera/models.yaml
      # Read even without a sandbox driver, so new organisations have the
      # classes once one is on. See README.md.
      KEERA_SANDBOXES_FILE: /etc/keera/sandboxes.yaml
      # `make dev` reads the same .env, so these override it: the port is the
      # one published below, and the podman driver cannot run in here.
      KEERA_ADDR: ":8080"
      KEERA_SANDBOX_DRIVER: ""
    healthcheck:
      # A scratch image has no shell or curl, so the binary checks /readyz.
      test: ["CMD", "/keera-gateway", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      keera-db:
        condition: service_healthy

  # The inference backend: llama.cpp on CPU, for a laptop with no GPU.
  # compose.gpu.yaml replaces it with vLLM on a GPU host.
  #
  # TOOL CALLING DOES NOT WORK ON THIS BACKEND: calls come back as prose, the
  # ToolCallAsText failure internal/gateway/probe.go names. See README.md.
  keera-engine:
    image: ${KEERA_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    # The image's entrypoint is /app/llama-server, so this is arguments only.
    command:
      # -hf downloads from Hugging Face on first start and caches it. The tag
      # picks the quantisation; Q4_K_M is the default, named to be explicit.
      - -hf
      - ${KEERA_LLAMA_MODEL:-Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M}
      # Like vLLM's --served-model-name. It must match backend_model in
      # models.yaml, so either backend works without a catalogue edit.
      - --alias
      - keera-speed
      # llama.cpp defaults to 8080. The catalogue, the healthcheck and vLLM on
      # the GPU tier use 8000.
      - --port
      - "8000"
      # Keep in step with max_context_tokens in models.yaml: the gateway refuses
      # anything larger, so a mismatch shows only when a long prompt is refused.
      - -c
      - "16384"
      # One slot, so a request gets the whole KV pool. A second one queues
      # instead of halving the window.
      - -np
      - "1"
      # Without it, a request with tools gets a 500. Recent builds default to
      # it, but coding agents depend on it. Some chat templates fail to render
      # under it, so confirm with `keera model check keera-speed`.
      - --jinja
      # No chat UI on /: the backend must not be an unauthenticated front end.
      - --no-webui
    environment:
      # Where -hf downloads to, so a recreate does not fetch the weights again.
      LLAMA_CACHE: /models
      # The image presets this; passing --host too logs a warning.
      LLAMA_ARG_HOST: 0.0.0.0
    volumes:
      - llama-cache:/models
    healthcheck:
      # Fits both tiers. compose.gpu.yaml must not replace `test`: see README.md.
      test: *http-health
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  # Keera Decider: Laya, a 421M classifier, served by laya-serve. It answers
  # routers and gate filters in one pass on CPU. See
  # docs/gateway.md#decision-models.
  #
  # laya-serve has no authentication without LAYA_API_KEY, so it is not
  # published.
  keera-decider:
    build: decider
    image: localhost/keera-decider:latest
    restart: unless-stopped
    volumes:
      - decider-cache:/root/.cache/huggingface
    healthcheck:
      test: *http-health
      interval: 15s
      timeout: 5s
      retries: 6
      # The first start downloads about 0.8 GB of weights.
      start_period: 300s

  keera-db:
    # Major version pinned: a new major cannot read an old one's files.
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: keera
      POSTGRES_PASSWORD: keera
      POSTGRES_DB: keera
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  llama-cache:
  pgdata:
  decider-cache:
