# Publishes the ports a gateway on the host has to reach. Used by `make dev`:
#
#   podman compose -f compose.yaml -f compose.dev.yaml up -d keera-db keera-engine keera-decider
#
# Only those three: the gateway runs on the host under air.
#
# Every port is bound to loopback. The backends have no authentication, so
# anything that reaches them bypasses the gateway's keys, budgets and audit.
# Do not copy this into a deployment.
services:
  keera-db:
    ports:
      - "127.0.0.1:5432:5432"

  keera-engine:
    ports:
      - "127.0.0.1:8000:8000"

  keera-decider:
    ports:
      - "127.0.0.1:8001:8000"
