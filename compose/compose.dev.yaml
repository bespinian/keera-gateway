# Publishes the ports a host-run gateway has to reach. Used by `make dev`,
# which is the intended entry point:
#
#   podman compose -f compose.yaml -f compose.dev.yaml up -d keera-db keera-engine keera-decider
#
# The target names only those three services on purpose. Under this file the
# gateway is the thing being edited - it runs on the host under air - so the
# containerised one would just fight it for :8080.
#
# Every port is bound to loopback, and closed in every other file here. The
# inference ports especially: the deployment files leave them unpublished
# because vLLM, llama.cpp and laya-serve have no authentication by default,
# so whatever can reach one has bypassed the gateway's keys, budgets and audit
# entirely. On a development machine, reachable only from loopback, that is a
# reasonable trade. It is not one to copy into a deployment.
services:
  keera-db:
    ports:
      - "127.0.0.1:5432:5432"

  keera-engine:
    ports:
      - "127.0.0.1:8000:8000"

  keera-decider:
    ports:
      - "127.0.0.1:8001:8000"
