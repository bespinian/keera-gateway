# Live reload for the gateway during development: `make dev`.
#
# The gateway runs on the host, not in a container, so a save rebuilds and
# restarts it in about a second. Postgres, the inference backend and Keera
# Decider stay up in containers.

root = "."
# Under build/, like every other build output.
tmp_dir = "build/air"
# Empty on purpose: the dev target sets up the environment, so it is described
# in one place.
env_files = []

[build]
  # The catalogue is generated from compose/models.yaml, so an edit there must
  # reach build/ before the restart.
  pre_cmd = ["make -s build/models.dev.yaml"]
  cmd ="go build -trimpath -o ./build/air/keera-gateway ./cmd/keera-gateway"
  bin = "./build/air/keera-gateway"
  args_bin = ["serve"]

  # The panel and the .sql migrations are embedded with go:embed, so editing
  # them needs a Go rebuild too.
  include_ext = ["go", "js", "css", "html", "svg", "sql", "yaml"]

  # vendor/ is thousands of files that change only on purpose; watching it
  # slows the start for nothing.
  exclude_dir = ["vendor", "build", "testdata", "docs", ".git"]
  exclude_regex = ["_test\\.go"]

  # SIGINT lets the binary release :8080. Killing it outright makes the next
  # build fail with "address already in use".
  send_interrupt = true
  kill_delay = "2s"

  # A build failure stops the gateway instead of leaving stale code serving.
  stop_on_error = true

  delay = 200
  # Written inside tmp_dir, not at the root.
  log = "build-errors.log"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
