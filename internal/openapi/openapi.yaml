        "403":
          description: The server is in a private network and the organisation has not paid yet (`org_limited`), or a subscription key while the deployment takes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such server, it is disabled, or the key may not call any of its tools (`mcp_server_not_found`). Subscription keys reach no MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The server could not be reached or read (`mcp_unavailable`), or it refused the gateway's credential for it (`mcp_credential_refused`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The control plane is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Any other status the server gave, such as 204 or 405, passed on.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        On `/control`: the operator key, or a CLI token from `keera login`
        (`keera_cli_...`). On `/api`: an API key.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: An API key, the way Anthropic clients send it.
    keeraKey:
      type: apiKey
      in: header
      name: X-Keera-Key
      description: |
        An API key, when `Authorization` carries the caller's own Claude
        sign-in instead. See https://docs.keera.ch/operate/claude-plans/.
    session:
      type: apiKey
      in: cookie
      name: keera_session
      description: |
        The panel's sign-in. A request that changes something must also send
        the `X-CSRF-Token` header, with the token from `GET /control/v1/me`.
  parameters:
    OrgID:
      name: org_id
      in: query
      description: |
        The organisation to act on. Only an operator, who belongs to none,
        needs it; everyone else acts on their own.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        type:
          type: string
          description: '"error", on answers Anthropic clients also read.'
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              examples: [invalid_request_error]
            code:
              type: string
    SignInProvider:
      type: object
      description: An identity provider the gateway signs people in through.
      required: [name, label, signup, password]
      properties:
        name:
          type: string
          description: What `provider` names it by.
        label:
          type: string
          description: What a person is shown.
        signup:
          type: boolean
          description: Whether somebody new may create an organisation through it.
        password:
          type: boolean
          description: Whether it asks for a password, as an LDAP directory does, instead of redirecting.
    SignInRedirect:
      type: object
      description: Where the panel goes next. For `keera login`, the loopback address with the code.
      required: [redirect]
      properties:
        redirect:
          type: string
    User:
      type: object
      description: A person in one organisation.
      required: [id, org_id, email, role, created_at]
      properties:
        id:
          type: string
        org_id:
          type: string
        email:
          type: string
        name:
          type: string
        external_id:
          type: string
          description: "`<provider>:<subject>`. Empty until their first sign-in."
        role:
          type: string
          enum: [operator, admin, member]
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          description: Set while the person is turned off.
        last_active_at:
          type: string
          format: date-time
          description: Their last sign-in or request. Only in lists.
    Membership:
      type: object
      description: One organisation a person is in, or was invited to.
      required: [user_id, org_id, org_name, role]
      properties:
        user_id:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        role:
          type: string
          enum: [operator, admin, member]
        invited:
          type: boolean
          description: Not joined yet. Switching to it joins.
    Passkey:
      type: object
      required: [id, user_id, name, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyLink:
      type: object
      description: A one-time set-up link. It holds the token, so it is shown once and never stored.
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    RegistrationOptions:
      type: object
      required: [challenge_id, email, options]
      properties:
        challenge_id:
          type: string
          description: Send it back with the answer.
        email:
          type: string
          description: The account the passkey is for.
        options:
          $ref: "#/components/schemas/CreationOptions"
    CreationOptions:
      type: object
      description: |
        What `navigator.credentials.create` is called with. Binary values are
        base64url.
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
        - timeout
        - excludeCredentials
        - authenticatorSelection
        - attestation
      properties:
        challenge:
          type: string
        rp:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            properties:
              type:
                type: string
                const: public-key
              alg:
                type: integer
                description: A COSE algorithm, such as -7 for ES256.
        timeout:
          type: integer
          description: Milliseconds.
        excludeCredentials:
          type: array
          description: The passkeys the person already has.
          items:
            $ref: "#/components/schemas/CredentialRef"
        authenticatorSelection:
          type: object
          required: [residentKey, requireResidentKey, userVerification]
          properties:
            residentKey:
              type: string
            requireResidentKey:
              type: boolean
            userVerification:
              type: string
        attestation:
          type: string
    RequestOptions:
      type: object
      description: |
        What `navigator.credentials.get` is called with. It lists no
        credentials, so the browser offers every passkey it has for this
        gateway.
      required: [challenge, rpId, timeout, userVerification, allowCredentials]
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
          description: Milliseconds.
        userVerification:
          type: string
        allowCredentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRef"
    CredentialRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          const: public-key
        id:
          type: string
          description: base64url.
    Registration:
      type: object
      description: The browser's answer to `navigator.credentials.create`. Binary values are base64url.
      required:
        [id, client_data_json, authenticator_data, public_key, algorithm]
      properties:
        id:
          type: string
        client_data_json:
          type: string
        authenticator_data:
          type: string
        public_key:
          type: string
          description: The SubjectPublicKeyInfo, as `getPublicKey()` returns it.
        algorithm:
          type: integer
          description: The COSE algorithm, as `getPublicKeyAlgorithm()` returns it.
    Assertion:
      type: object
      description: The browser's answer to `navigator.credentials.get`. Binary values are base64url.
      required: [id, client_data_json, authenticator_data, signature]
      properties:
        id:
          type: string
        client_data_json:
          type: string
        authenticator_data:
          type: string
        signature:
          type: string
        user_handle:
          type: string
    AccessKey:
      description: One of the caller's keys, with what decides whether it works.
      allOf:
        - { $ref: "#/components/schemas/KeySummary" }
        - type: object
          required: [state, scopes]
          properties:
            project_name:
              type: string
            state:
              type: string
              enum: [active, pending, expired, revoked]
            scopes:
              type: array
              description: The levels whose limits apply, organisation first.
              items: { $ref: "#/components/schemas/AccessScope" }
            allowed_models:
              type: array
              description: The models and routers the key may call.
              items:
                type: string
    AccessScope:
      type: object
      description: One level above a key, with its limits and what is used of them.
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/ScopeType"
        id:
          type: string
        name:
          type: string
        rates:
          type: array
          items:
            $ref: "#/components/schemas/AccessRate"
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/AccessBudget"
        system_prompt:
          type: string
          description: This level's own instruction, not the joined chain.
        filters:
          type: array
          description: This level's own filters.
          items:
            type: string
    AccessRate:
      type: object
      description: One rate limit. Per day or month, the `_used` fields say how much is gone.
      required: [period]
      properties:
        requests:
          type: integer
        tokens:
          type: integer
        period:
          type: string
          enum: [minute, day, month]
        requests_used:
          type: integer
        tokens_used:
          type: integer
    AccessBudget:
      type: object
      required: [budget_micros, spend_micros, period, resets_at]
      properties:
        budget_micros:
          type: integer
          description: Millionths of the currency unit.
        spend_micros:
          type: integer
        period:
          $ref: "#/components/schemas/Period"
        resets_at:
          type: string
          format: date-time
    Refusal:
      type: object
      description: |
        A request the gateway turned away. The status is the reason: 402 a
        spent budget, 429 a rate limit, 404 a model the key may not use.
      required: [created_at, status]
      properties:
        created_at:
          type: string
          format: date-time
        alias:
          type: string
        status:
          type: integer
        key_id:
          type: string
        error:
          type: string
          description: What the client was told.
    Org:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        email_domain:
          type: string
          description: Places a first sign-in from this domain here.
        limited:
          type: boolean
          description: |
            It signed up and has not paid yet. Its models may not run on the
            deployment's own machines, and it gets no sandboxes.
        created_at:
          type: string
          format: date-time
    Project:
      type: object
      required: [id, org_id, name, description, created_at]
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectSummary:
      description: A project with its guardrails and its spend.
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required:
            [
              limits,
              active_keys,
              spend_micros,
              budget_micros,
              period,
              resets_at,
            ]
          properties:
            limits: { $ref: "#/components/schemas/Limits" }
            active_keys:
              type: integer
            spend_micros:
              type: integer
              format: int64
              description: Spend this period, in millionths of the currency.
            budget_micros:
              type: integer
              format: int64
              description: |
                The budget that will stop the project's keys first, or 0 for
                none.
            period:
              $ref: "#/components/schemas/Period"
            resets_at:
              type: string
              format: date-time
              description: When the period starts again.
    KeyKind:
      type: string
      enum: [standard, subscription]
      description: |
        `standard` reaches every model its guardrails allow. `subscription`
        reaches only models paid by the person's own Claude subscription.
        Defaults to `standard`.
    KeyInfo:
      type: object
      description: An issued key, without its secret.
      required: [id, org_id, name, prefix, kind, created_at]
      properties:
        id:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
          description: The person whose spend this is.
        name:
          type: string
        prefix:
          type: string
          description: The start of the secret, to recognise it by. Empty while pending.
        kind:
          $ref: "#/components/schemas/KeyKind"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        pending:
          type: boolean
          description: Waiting to be activated. It has no secret yet.
    KeySummary:
      description: A key with its own guardrails, last use and spend.
      allOf:
        - $ref: "#/components/schemas/KeyInfo"
        - type: object
          required: [limits, requests, spend_micros, subscription_micros]
          properties:
            limits: { $ref: "#/components/schemas/Limits" }
            last_used_at:
              type: string
              format: date-time
            requests:
              type: integer
              format: int64
              description: Requests served.
            spend_micros:
              type: integer
              format: int64
            subscription_micros:
              type: integer
              format: int64
              description: For a subscription key, what the person's Claude plan paid for, at API prices.
            plan: { $ref: "#/components/schemas/PlanUsage" }
    PlanUsage:
      type: object
      description: How much of a Claude plan's usage limit is used, as Anthropic reports it.
      required: [updated_at]
      properties:
        five_hour:
          type: number
          minimum: 0
          maximum: 1
        five_hour_resets_at:
          type: string
          format: date-time
        seven_day:
          type: number
          minimum: 0
          maximum: 1
        seven_day_resets_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [allowed, allowed_warning, rejected]
        updated_at:
          type: string
          format: date-time
    Period:
      type: string
      enum: [day, month]
    ScopeType:
      type: string
      enum: [org, project, key]
    Limits:
      type: object
      additionalProperties: false
      description: |
        One scope's guardrail. A field left out or null inherits from the
        level above. For the lists, an empty list allows nothing and null
        inherits, so answers always carry them. The sandbox fields may not be
        set on a key.
      properties:
        allowed_models:
          type: [array, "null"]
          items:
            type: string
          description: Model aliases this scope may use.
        rate_limits:
          type: [array, "null"]
          description: At most one per period.
          items:
            $ref: "#/components/schemas/RateLimit"
        budgets:
          type: [array, "null"]
          description: At most one per period.
          items:
            $ref: "#/components/schemas/Budget"
        system_prompt:
          type: [string, "null"]
          maxLength: 16384
          description: |
            Put ahead of every chat request's own messages, after those of the
            levels above. At most 16 KiB.
        filters:
          type: [array, "null"]
          items:
            type: string
          description: Filter aliases, in the order they run, after those of the levels above.
        allowed_tools:
          type: [array, "null"]
          items:
            type: string
          description: MCP tools this scope may call. An MCP server's alias for all its tools, or `alias/tool` for one.
        max_sandboxes:
          type: [integer, "null"]
          description: Live sandboxes at once. 0 is no limit.
        max_sandbox_ttl_seconds:
          type: [integer, "null"]
          description: Longest lifetime of one sandbox. 0 is no limit.
        sandbox_classes:
          type: [array, "null"]
          items:
            type: string
          description: Sandbox classes this scope may use.
        max_sandbox_cpu_millis:
          type: [integer, "null"]
          description: Most CPU for one sandbox, in millicores. 0 is no limit.
        max_sandbox_memory_mib:
          type: [integer, "null"]
          description: Most memory for one sandbox, in MiB. 0 is no limit.
        allowed_repos:
          type: [array, "null"]
          items:
            type: string
          description: |
            Repositories a sandbox may check out: `owner/repo`, `owner` for
            all under it, or `*`. Where no level sets it, none may be. On an
            organisation, only an operator may change it.
          examples: [[bankb, other/core]]
    RateLimit:
      type: object
      additionalProperties: false
      description: The most a scope may use per period. Set `requests`, `tokens` or both.
      properties:
        requests:
          type: integer
          format: int64
          minimum: 1
        tokens:
          type: integer
          format: int64
          minimum: 1
        period:
          type: string
          enum: [minute, day, month]
          default: minute
    Budget:
      type: object
      additionalProperties: false
      description: The most a scope may spend per period.
      required: [budget_micros]
      properties:
        budget_micros:
          type: integer
          format: int64
          minimum: 1
          description: In millionths of the currency.
        period:
          type: string
          enum: [day, month]
          default: month
    Scope:
      type: object
      description: One level's limits as the gateway enforces them.
      required: [type, id, rpm, tpm, budget_micros, period]
      properties:
        type:
          $ref: "#/components/schemas/ScopeType"
        id:
          type: string
        rpm:
          type: integer
          description: Requests per minute. 0 is no limit.
        tpm:
          type: integer
          description: Tokens per minute. 0 is no limit.
        budget_micros:
          type: integer
          format: int64
          description: 0 is no limit.
        period:
          $ref: "#/components/schemas/Period"
        meter:
          type: string
          enum: [requests, tokens]
          description: What the period counts. Absent is money.
        quota:
          type: integer
          format: int64
          description: The most `meter` may count. 0 is no limit.
    ResolvedSandbox:
      type: object
      description: "What a sandbox may be: the organisation's guardrail, narrowed by the project's. Zero means unlimited."
      required:
        [
          max_sandboxes,
          max_sandbox_ttl_seconds,
          sandbox_classes,
          max_sandbox_cpu_millis,
          max_sandbox_memory_mib,
          allowed_repos,
        ]
      properties:
        max_sandboxes:
          type: integer
        max_sandbox_ttl_seconds:
          type: integer
        sandbox_classes:
          type: [array, "null"]
          items:
            type: string
          description: Null allows every class.
        max_sandbox_cpu_millis:
          type: integer
        max_sandbox_memory_mib:
          type: integer
        allowed_repos:
          type: [array, "null"]
          items:
            type: string
          description: Null allows no repository, not every one.
    EffectiveLevel:
      type: object
      description: One level above a scope, with what it sets on its own.
      required: [type, id, limits]
      properties:
        type:
          $ref: "#/components/schemas/ScopeType"
        id:
          type: string
        name:
          type: string
        limits:
          $ref: "#/components/schemas/Limits"
    Effective:
      type: object
      description: |
        What a request against a scope meets. Rate limits and budgets stay per
        level in `scopes`, because each level is enforced on its own.
      required:
        [type, id, levels, allowed_models, allowed_tools, scopes, sandbox]
      properties:
        type:
          $ref: "#/components/schemas/ScopeType"
        id:
          type: string
        levels:
          type: array
          description: Organisation, then project, then key, as far as they apply.
          items:
            $ref: "#/components/schemas/EffectiveLevel"
        allowed_models:
          type: [array, "null"]
          items:
            type: string
          description: null is every enabled model. An empty list is none.
        system_prompt:
          type: string
          description: Every level's prompt joined, outermost first.
        filters:
          type: array
          items:
            type: string
          description: Every level's filters, in the order they run.
        allowed_tools:
          type: [array, "null"]
          items:
            type: string
          description: null is every tool of every MCP server.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        sandbox:
          $ref: "#/components/schemas/ResolvedSandbox"
    AliasDeleted:
      type: object
      description: The answer to deleting a filter, router, model or MCP server.
      required: [alias, deleted]
      properties:
        alias:
          type: string
        deleted:
          type: boolean
          const: true
    Filter:
      type: object
      description: |
        Reads a request before it is forwarded, and may change or stop it.
        See https://docs.keera.ch/manage/filters/.
      required: [org_id, alias, model, mode, prompt, created_at, updated_at]
      properties:
        org_id:
          type: string
        alias:
          type: string
        model:
          type: string
          description: The model it runs on. Empty on a pattern filter.
        mode:
          type: string
          enum: [rewrite, gate, pattern]
        prompt:
          type: string
          description: The instruction for its model. Empty on a pattern filter.
        rules:
          type: array
          description: A pattern filter's rules, applied in order.
          items:
            $ref: "#/components/schemas/FilterRule"
        shadow:
          type: boolean
          description: Runs and records, but enforces nothing.
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FilterRule:
      type: object
      description: One rule of a pattern filter. It either replaces or refuses.
      required: [pattern]
      properties:
        pattern:
          type: string
          maxLength: 512
          description: An RE2 expression, as Go's regexp reads it. It may not match the empty string.
        replace:
          type: string
          description: Put in literally for each match; `$1` is not expanded.
        refuse:
          type: boolean
          description: Refuse the request when this matches, instead of replacing.
        reason:
          type: string
          maxLength: 240
          description: The sentence a refusal gives the sender. Only with `refuse`.
    FilterStat:
      type: object
      description: One filter's traffic over a window.
      required:
        [
          filter,
          runs,
          passed,
          rewrote,
          refused,
          errored,
          shadowed,
          latency_median_ms,
          latency_p95_ms,
          cost_micros,
          segments,
          changed,
        ]
      properties:
        filter:
          type: string
        runs:
          type: integer
          format: int64
        passed:
          type: integer
          format: int64
        rewrote:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        errored:
          type: integer
          format: int64
        shadowed:
          type: integer
          format: int64
          description: How many runs enforced nothing.
        latency_median_ms:
          type: integer
          format: int64
        latency_p95_ms:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
        segments:
          type: integer
          format: int64
        changed:
          type: integer
          format: int64
        last_run_at:
          type: string
          format: date-time
        first_run_at:
          type: string
          format: date-time
    FilterPoint:
      type: object
      description: One bucket of a filter's chart.
      required: [at, runs, refused, errored, rewrote, cost_micros]
      properties:
        at:
          type: string
          format: date-time
        runs:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        errored:
          type: integer
          format: int64
        rewrote:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
    FilterProjectRow:
      type: object
      description: One project's runs of a filter.
      required: [project_id, runs, refused, rewrote, errored, cost_micros]
      properties:
        project_id:
          type: string
          description: Empty for requests outside any project.
        runs:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        rewrote:
          type: integer
          format: int64
        errored:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
    FilterReport:
      description: One filter's own screen.
      allOf:
        - $ref: "#/components/schemas/FilterStat"
        - type: object
          required:
            [from, to, bucket, series, projects, requests, org_cost_micros]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            bucket:
              type: string
              enum: [hour, day]
            series:
              type: array
              items: { $ref: "#/components/schemas/FilterPoint" }
            projects:
              type: array
              description: Most refused first.
              items: { $ref: "#/components/schemas/FilterProjectRow" }
            requests:
              type: integer
              format: int64
              description: The organisation's requests in the window.
            org_cost_micros:
              type: integer
              format: int64
              description: The organisation's cost in the window.
    FilterProbe:
      type: object
      description: |
        What one filter check found. A rewrite filter fills `segments`, a gate
        `verdicts`, a pattern filter `hits`.
      required: [alias, mode, model, ok]
      properties:
        alias:
          type: string
        mode:
          type: string
          enum: [rewrite, gate, pattern]
        model:
          type: string
        shadow:
          type: boolean
        segments:
          type: array
          items:
            $ref: "#/components/schemas/FilterSegment"
        total_ms:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
        error:
          type: string
        refused:
          type: boolean
          description: It refused the sample instead of rewriting it.
        refusal:
          type: string
          description: Its sentence when it refused.
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/FilterVerdict"
        hits:
          type: array
          items:
            $ref: "#/components/schemas/FilterPatternHit"
        free:
          type: boolean
          description: The run cost nothing and used no GPU.
        warnings:
          type: array
          items:
            type: string
        ok:
          type: boolean
    FilterSegment:
      type: object
      description: One sample text, before and after.
      required: [before, after, changed]
      properties:
        before:
          type: string
        after:
          type: string
        changed:
          type: boolean
    FilterVerdict:
      type: object
      description: One gate run over half of the sample.
      required: [sent, refused, expect_refusal]
      properties:
        sent:
          type: array
          items:
            type: string
        refused:
          type: boolean
        reason:
          type: string
        expect_refusal:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Left out when the backend served no logprobs.
    FilterPatternHit:
      type: object
      description: One pattern rule that matched the sample.
      required: [rule, matches]
      properties:
        rule:
          type: string
          description: The expression that matched.
        matches:
          type: integer
        refused:
          type: boolean
    Router:
      type: object
      description: A tree of steps a request goes through. See https://docs.keera.ch/manage/routers/.
      required: [org_id, alias, start, created_at, updated_at]
      properties:
        org_id:
          type: string
        alias:
          type: string
        display_name:
          type: string
        description:
          type: string
        start:
          $ref: "#/components/schemas/RouterStep"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedRouter:
      description: A router as saved, with what to look at.
      allOf:
        - $ref: "#/components/schemas/Router"
        - type: object
          properties:
            warning:
              type: string
              description: What the organisation's allow-list now does with the router.
            warnings:
              type: array
              description: Likely mistakes in the router itself.
              items: { type: string }
    RouterStep:
      type: object
      description: |
        One step of a router. Which fields it may set depends on `kind`:

        - `filter` and `model` name what they use in `ref`.
        - `route` has `mode`, `destinations` and `branches`; an instruction
          step also `model`, `prompt` and `fallback`, a size step `ceilings`,
          a header step `header`, `values` and `fallback`.
        - `rate_limit` has `requests`, `tokens` and `period`; `budget` has
          `budget_micros` and `period`. Both may have `exceeded`.
        - `system_prompt` has `prompt`.

        Every step but `route` and `model` needs `next`. A router has at most
        64 steps.
      required: [id, kind]
      properties:
        id:
          type: string
          maxLength: 32
          description: Unique in the router. Lowercase letters, digits and inner hyphens.
        kind:
          type: string
          enum: [filter, route, rate_limit, budget, model, system_prompt]
        ref:
          type: string
          description: The filter or model alias a `filter` or `model` step uses.
        requests:
          type: integer
          format: int64
          description: A rate limit's requests per period. 0 means no limit.
        tokens:
          type: integer
          format: int64
          description: A rate limit's tokens per period. 0 means no limit.
        budget_micros:
          type: integer
          format: int64
          description: A budget's most spend per period.
        prompt:
          type: string
          description: |
            A system prompt step's text (up to 16 KiB), or an instruction
            step's instruction (up to 4 KiB).
        mode:
          type: string
          enum: [instruction, fallback, latency, least-busy, size, header]
          description: A route step's way of choosing. Defaults to instruction.
        model:
          type: string
          description: The model an instruction step decides with.
        destinations:
          type: array
          maxItems: 16
          description: The models a route step chooses between.
          items:
            type: string
        ceilings:
          type: object
          description: |
            A size step's largest request, in estimated tokens, per
            destination. Exactly one destination has none.
          additionalProperties:
            type: integer
        header:
          type: string
          maxLength: 64
          description: |
            The request header a header step chooses by, such as
            `X-Keera-Route`. It cannot be a header that carries a credential.
        values:
          type: object
          maxProperties: 32
          description: |
            A header step's values, each naming the destination it sends a
            request to. A value is lowercase letters, digits and inner
            hyphens; the header is compared in lowercase. Every destination
            is named by a value or is the fallback.
          additionalProperties:
            type: string
        fallback:
          type: string
          description: |
            Where an instruction step sends what it could not decide, or a
            header step a request whose header names no destination. Empty
            refuses it.
        period:
          type: string
          enum: [minute, day, month]
          description: |
            What a limit counts over. A rate limit defaults to minute; a
            budget takes day or month and defaults to month.
        next:
          $ref: "#/components/schemas/RouterStep"
        exceeded:
          $ref: "#/components/schemas/RouterStep"
        branches:
          type: object
          description: |
            A route step's next steps, by destination. A destination with none
            is sent the request straight away.
          additionalProperties:
            $ref: "#/components/schemas/RouterStep"
    UsageCell:
      type: object
      description: Traffic added up over a window.
      required:
        [
          requests,
          input_tokens,
          output_tokens,
          cost_micros,
          refused,
          failed,
          ttft_median_ms,
        ]
      properties:
        requests:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
          description: Every 4xx answer.
        failed:
          type: integer
          format: int64
          description: Every 5xx answer.
        ttft_median_ms:
          type: integer
          format: int64
    RouterStat:
      description: One router's headline for the list.
      allOf:
        - $ref: "#/components/schemas/UsageCell"
        - type: object
          required: [chose, fell_back, errored]
          properties:
            chose: { type: integer, format: int64 }
            fell_back: { type: integer, format: int64 }
            errored: { type: integer, format: int64 }
    RouterDestination:
      description: Where one router sent its traffic.
      allOf:
        - type: object
          required: [alias]
          properties:
            alias: { type: string }
        - $ref: "#/components/schemas/UsageCell"
    RouterLimit:
      type: object
      description: |
        One limit step of a router and what it used in its open window,
        whatever window the report covers. A step has `budget` or `rate`.
      required: [step]
      properties:
        step:
          type: string
          description: The step's id.
        budget:
          $ref: "#/components/schemas/AccessBudget"
        rate:
          $ref: "#/components/schemas/AccessRate"
    RouterReport:
      type: object
      description: One router's own screen.
      required:
        [
          router,
          total,
          destinations,
          chose,
          fell_back,
          errored,
          decision_median_ms,
          decision_p95_ms,
        ]
      properties:
        router:
          type: string
        total:
          $ref: "#/components/schemas/UsageCell"
        destinations:
          type: array
          description: Most used first.
          items:
            $ref: "#/components/schemas/RouterDestination"
        chose:
          type: integer
          format: int64
        fell_back:
          type: integer
          format: int64
        errored:
          type: integer
          format: int64
        decision_median_ms:
          type: integer
          format: int64
        decision_p95_ms:
          type: integer
          format: int64
    RouterCheck:
      type: object
      required: [router, routes]
      properties:
        router:
          type: string
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteProbe"
    RouteProbe:
      type: object
      description: |
        What checking one route step found. An instruction step fills
        `decisions`; the other modes fill `chain`.
      required: [step, mode, destinations, ok]
      properties:
        step:
          type: string
        mode:
          type: string
          enum: [instruction, fallback, latency, least-busy, size]
        model:
          type: string
        destinations:
          type: array
          description: What the step offered when checked.
          items:
            type: string
        dropped:
          type: array
          description: Destinations that were not offered, and why.
          items:
            type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/RouteSampleDecision"
        chain:
          type: array
          items:
            $ref: "#/components/schemas/RouteHop"
        total_ms:
          type: integer
          format: int64
        cost_micros:
          type: integer
          format: int64
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
        ok:
          type: boolean
    RouteSampleDecision:
      type: object
      description: One sample prompt and where the step sent it.
      required: [prompt, asks]
      properties:
        prompt:
          type: string
        asks:
          type: string
          description: What the sample tests.
        chosen:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Left out when the backend served no logprobs.
        error:
          type: string
    RouteHop:
      type: object
      description: One destination of a trying step, in the order it would be tried.
      required: [alias, answers]
      properties:
        alias:
          type: string
        answers:
          type: boolean
        status:
          type: integer
        ms:
          type: integer
          format: int64
        note:
          type: string
        reading:
          type: string
          description: Why it is in this place, on a step that ranks by measurement or size.
    OrgModel:
      type: object
      description: One of an organisation's models. Clients name only its alias.
      required:
        [
          alias,
          org_id,
          kind,
          backends,
          backend_model,
          input_micros_per_mtok,
          output_micros_per_mtok,
          cached_input_micros_per_mtok,
          cache_write_micros_per_mtok,
          max_context_tokens,
          location,
          enabled,
        ]
      properties:
        alias:
          type: string
        org_id:
          type: string
        kind:
          type: string
          enum: [chat, completion, embedding, decision]
        backends:
          type: [array, "null"]
          description: Base URLs. `null` for anyone but an administrator.
          items:
            type: string
        backend_model:
          type: string
        provider:
          type: string
        display_name:
          type: string
        description:
          type: string
        input_micros_per_mtok:
          type: integer
          format: int64
        output_micros_per_mtok:
          type: integer
          format: int64
        cached_input_micros_per_mtok:
          type: integer
          format: int64
        cache_write_micros_per_mtok:
          type: integer
          format: int64
        long_prompt:
          $ref: "#/components/schemas/PriceTier"
        max_context_tokens:
          type: integer
        release_date:
          type: string
          format: date
        location:
          type: string
          description: Where it runs, such as `ch`, `usa` or `onprem`.
        has_api_key:
          type: boolean
          description: A credential is stored. Only administrators see it.
        subscription:
          type: boolean
          description: Paid by each caller's own Claude plan.
        platform_key:
          type: boolean
          description: The deployment holds the provider's key, and bills the model.
        enabled:
          type: boolean
    PriceTier:
      type: object
      description: The prices for a prompt longer than `above_tokens`.
      required:
        [
          above_tokens,
          input_micros_per_mtok,
          output_micros_per_mtok,
          cached_input_micros_per_mtok,
          cache_write_micros_per_mtok,
