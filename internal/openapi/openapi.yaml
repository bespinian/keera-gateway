        description: The sandbox's id (`sbx_...`) or its name. A name is unique only for one person in one organisation, so an operator naming one also passes `org_id`.
        schema:
          type: string
    post:
      tags:
        - sandboxes
      operationId: resumeSandbox
      summary: Resume a sandbox
      description: Brings back a suspended or expired sandbox. An expired one gets a new key and lifetime, under the guardrail as it is now. It finishes in the background, so the answer is the state read back now.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox's state does not allow it, or the manager refused. The code is `sandbox_state`, `sandbox_not_ready` or `sandbox_ambiguous`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/sandboxes/{ref}/extend:
    parameters:
      - name: ref
        in: path
        required: true
        description: The sandbox's id (`sbx_...`) or its name. A name is unique only for one person in one organisation, so an operator naming one also passes `org_id`.
        schema:
          type: string
    post:
      tags:
        - sandboxes
      operationId: extendSandbox
      summary: Extend a sandbox's lifetime
      description: "Sets the expiry to now plus the lifetime asked for, cut down to the class's and the guardrail's ceilings. No body is the same as `{}`: the class default."
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: false
        content:
