        schema:
          type: string
    put:
      tags:
        - sandboxes
      operationId: putSandboxClass
      summary: Create or replace a sandbox class
      description: Administrators only. The body has the shape the list returns, so a class read can be written back; `org_id`, `created_at` and `updated_at` are ignored and the name comes from the path. Zero or empty fields take their defaults (isolation `isolated`). An administrator may only use the images of the starting classes, those `KEERA_SANDBOX_IMAGES` allows, or the image the class already has.
      parameters:
