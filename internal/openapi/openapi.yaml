  /api/mcp/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: The MCP server's alias.
        schema:
          type: string
    post:
      tags:
        - mcp
      operationId: sendMcpMessage
      summary: Send MCP messages
      description: |-
        MCP's Streamable HTTP transport, behind the API key. The body is one JSON-RPC message, or a batch. The gateway lists only the tools the key may call and refuses the others, runs the key's filters over a tool call's arguments, presents the server's own credential and records each call. Everything else is passed through.

        A refusal of the gateway's own is a JSON-RPC error with status 200, such as a tool the key may not call, a tool call without an id, or a tool call inside a batch. A key that may call only some tools may send only `initialize`, `ping`, `tools/*`, `logging/setLevel` and `tasks/*` other than `tasks/list`. The client sends `Accept: application/json, text/event-stream`, as MCP asks.
      externalDocs:
        description: MCP Streamable HTTP transport
        url: https://modelcontextprotocol.io/specification/2025-06-18/basic/transports
      security:
        - bearer: []
        - apiKey: []
        - keeraKey: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          description: The MCP session, passed to the server and back.
          schema:
            type: string
        - name: Mcp-Protocol-Version
          in: header
          description: Passed to the server.
          schema:
            type: string
        - name: Mcp-Method
          in: header
          description: Must match the message's method when sent.
          schema:
            type: string
        - name: Mcp-Name
          in: header
          description: Must match the tool name or URI in the message when sent.
          schema:
            type: string
        - name: X-Keera-Session
          in: header
          description: Names the session (task) this request belongs to, instead of the one the gateway derives from the opening prompt. `X-Session-Id`, `Helicone-Session-Id` and `X-Claude-Code-Session-Id` are read too; the first with a value wins. See https://docs.keera.ch/monitor/requests-and-sessions/.
          schema:
            type: string
        - name: X-Keera-Client
          in: header
          description: The client's own name, which wins over the `User-Agent`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JsonRpcMessage"
                - type: array
                  items:
                    $ref: "#/components/schemas/JsonRpcMessage"
      responses:
        "200":
          description: The server's answer, or a JSON-RPC error from the gateway.
          headers:
            X-Request-Id:
              description: "The request's id. One the client sent is kept if it is up to 64 of `A-Z a-z 0-9 . _ : -`."
              schema:
                type: string
            Mcp-Session-Id:
              description: The session the server gave, passed back.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcMessage"
                  - type: array
                    items:
                      $ref: "#/components/schemas/JsonRpcMessage"
            text/event-stream:
              schema:
                type: string
                description: JSON-RPC messages as server-sent events.
        "202":
          description: "Accepted: the body held only notifications or responses."
          headers:
            X-Request-Id:
              description: "The request's id. One the client sent is kept if it is up to 64 of `A-Z a-z 0-9 . _ : -`."
              schema:
                type: string
            Mcp-Session-Id:
              description: The session the server gave, passed back.
              schema:
                type: string
        "400":
          description: The `Mcp-Method` or `Mcp-Name` header does not match the message (JSON-RPC error -32020), or the body could not be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcMessage"
                  - $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The server is in a private network and the organisation has not paid yet (`org_limited`), or a subscription key while the deployment takes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such server, it is disabled, or the key may not call any of its tools (`mcp_server_not_found`). Subscription keys reach no MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The server could not be reached or read (`mcp_unavailable`), or it refused the gateway's credential for it (`mcp_credential_refused`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The control plane is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is over the gateway's limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: A `Content-Encoding` other than gzip or deflate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Any other status the server gave, passed on. A body that is neither JSON nor an event stream is dropped.
    get:
      tags:
        - mcp
      operationId: openMcpStream
      summary: Open the server's event stream
      description: Passed through to the server, which may answer 405 if it has no stream.
      externalDocs:
        description: MCP Streamable HTTP transport
        url: https://modelcontextprotocol.io/specification/2025-06-18/basic/transports
