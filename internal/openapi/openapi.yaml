            enum: [chat, completion, embedding, decision]
        models:
          type: array
          items:
            $ref: "#/components/schemas/HostedProviderModel"
        summary:
          type: string
        platform_key:
          type: boolean
          description: The deployment holds this provider's key, so models take none.
    HostedProviderModel:
      type: object
      description: One model a hosted provider serves.
      required:
        [
          id,
          display_name,
          max_context_tokens,
          input_micros_per_mtok,
          output_micros_per_mtok,
          cached_input_micros_per_mtok,
          description,
        ]
      properties:
        id:
          type: string
        display_name:
          type: string
        max_context_tokens:
          type: integer
        release_date:
          type: string
          format: date
        input_micros_per_mtok:
          type: integer
          format: int64
        output_micros_per_mtok:
          type: integer
          format: int64
        cached_input_micros_per_mtok:
          type: integer
          format: int64
        cache_write_micros_per_mtok:
          type: integer
          format: int64
        long_prompt:
          $ref: "#/components/schemas/PriceTier"
        description:
          type: string
        snapshot:
          type: string
          description: The dated id the maker also uses, such as `claude-haiku-4-5-20251001`.
    MCPServer:
      type: object
      description: An MCP server the gateway stands in front of. See https://docs.keera.ch/manage/mcp/.
