# The OpenAPI description of every route the gateway serves, at /openapi.yaml
# and /openapi.json. It is written by hand. A test in internal/server fails
# while a route is missing here, or this describes one that is gone.
#
# info.version is replaced with the build's version when it is served.

openapi: 3.1.0
info:
  title: Keera Gateway
  summary: The one endpoint every AI request passes through.
  description: |
    One listener serves three APIs, told apart by path:

    - `/api` is the inference API. It speaks the OpenAI and Anthropic formats,
      so their SDKs work with only a new base URL and an API key.
    - `/control` is the control API, which the panel and the `keera` command use.
    - `/sandbox` attaches to a sandbox.

    Errors take the shape of the API that was called. The OpenAI APIs and the
    control API answer `{"error": {"message", "type", "code"}}`. The Anthropic
    Messages API answers `{"type": "error", "error": {"type", "message"}}`,
    with no code. See https://docs.keera.ch/reference/errors/.
  license:
    name: Keera Community Licence v1.0
    url: https://github.com/bespinian/keera-gateway/blob/main/LICENSE
  version: 0.9.0
servers:
  - url: /
security:
  - bearer: []
  - session: []
tags:
  - name: inference
    description: OpenAI- and Anthropic-shaped requests, behind an API key.
  - name: mcp
    description: MCP servers, behind the same API keys.
  - name: probes
    description: Liveness, readiness and metrics, for orchestrators and scrapers.
  - name: sign-in
    description: Signing in and out of the control API.
  - name: me
    description: The caller and their own access.
  - name: tenancy
    description: Organisations, projects, users and passkeys.
  - name: keys
    description: API keys.
  - name: guardrails
    description: Limits and rules per organisation, project or key.
  - name: filters
  - name: routers
  - name: models
  - name: mcp-servers
  - name: connect
    description: Setting up clients against this gateway.
  - name: reports
    description: Usage, requests, sessions, audit and diagnostics.
  - name: billing
  - name: sandboxes
  - name: spec
    description: This description, as YAML or JSON.
paths:
  /openapi.yaml:
    get:
      operationId: getSpecYAML
      tags: [spec]
      summary: This spec, as YAML
      security: []
      responses:
        "200":
          description: The spec, with `info.version` set to the running build.
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getSpecJSON
      tags: [spec]
      summary: This spec, as JSON
      security: []
      responses:
        "200":
          description: The spec, with `info.version` set to the running build.
          content:
            application/json:
              schema:
                type: object
  /control/auth/config:
    get:
      operationId: authConfig
      tags: [sign-in]
      summary: How to sign in
      description: What the panel offers on its sign-in screen, before anybody has signed in.
      security: []
      responses:
        "200":
          description: The ways in.
          content:
            application/json:
              schema:
                type: object
                required: [sso, providers, passkeys]
                properties:
                  sso:
                    type: boolean
                    description: Whether an identity provider is configured.
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignInProvider"
                  passkeys:
                    type: boolean
                    description: Whether passkeys are on.
  /control/auth/login:
    get:
      operationId: login
      tags: [sign-in]
      summary: Start a sign-in
      description: |
        Opened in a browser. It sends the browser to the identity provider,
        or for a password directory or passkeys to the panel's own form.
        `keera login` and Keera Chat add the `cli_*` parameters, so the
        sign-in ends at their address with a one-time code for
        `POST /control/auth/cli/token`.

        A sign-in that cannot start also redirects, to `/?sign_in_error=1`,
        with the reason in the `keera_sign_in_error` cookie.
      security: []
      parameters:
        - name: provider
          in: query
          description: |
            The identity provider's name, or `passkey`. It may be left out
            only when there is one way in.
          schema: { type: string }
        - name: next
          in: query
          description: A path on this site to go to afterwards. Anything else is ignored.
          schema: { type: string }
        - name: cli_redirect
          in: query
          description: |
            Where a command-line sign-in ends: a loopback address such as
            `http://127.0.0.1:1234/callback`, or Keera Chat's callback under
            `KEERA_CHAT_URL`.
          schema: { type: string, format: uri }
        - name: cli_challenge
          in: query
          description: The PKCE S256 challenge, 32 bytes as unpadded base64url. Needed with `cli_redirect`.
          schema: { type: string }
        - name: cli_state
          in: query
          description: Handed back with the code. Needed with `cli_redirect`; up to 128 characters.
          schema: { type: string, maxLength: 128 }
      responses:
        "302":
          description: |
            To the identity provider, to the panel's password or passkey
            form, or back to the sign-in screen with an error.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: "`keera_login`, the state the callback must match."
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/auth/callback:
    get:
      operationId: callback
      tags: [sign-in]
      summary: Finish a sign-in
      description: |
        Where the identity provider sends the browser back. It only works in
        the browser that started the sign-in.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by the identity provider when it refused.
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
        - name: keera_login
          in: cookie
          description: Set by `GET /control/auth/login`; must match `state`.
          schema: { type: string }
      responses:
        "302":
          description: |
            Signed in, to `next` or `/`; for a command-line sign-in, to its
            address with `code` and `state`. Somebody new where sign-up is
            allowed goes to `/?sign_up=1`. A failed sign-in goes to
            `/?sign_in_error=1`, with the reason in the `keera_sign_in_error`
            cookie.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: "`keera_session` once signed in, or `keera_signup` for the sign-up screen."
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /control/auth/local:
    post:
      operationId: localLogin
      tags: [sign-in]
      summary: Sign in with the operator key
      description: Starts a panel session that grants what the operator key grants.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key:
                  type: string
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`keera_session`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/cli/token:
    post:
      operationId: cliToken
      tags: [sign-in]
      summary: Redeem a sign-in code for a CLI token
      description: |
        The last step of `keera login`. The code works once, and only with
        the PKCE verifier of the process that started the sign-in. Send the
        token as `Authorization: Bearer <token>`; `GET /control/v1/me` says
        whose it is.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, verifier]
              properties:
                code:
                  type: string
                verifier:
                  type: string
                label:
                  type: string
                  description: How the machine describes itself, for the audit log.
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    description: Starts with `keera_cli_`. Shown only here.
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/password:
    post:
      operationId: passwordSignIn
      tags: [sign-in]
      summary: Sign in with a directory password
      description: |
        For an LDAP directory. Attempts are also limited per account, from
        any address. Must be sent as `application/json`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, username, password]
              properties:
                provider:
                  type: string
                  description: A provider whose `password` is true.
                flow:
                  type: string
                  description: |
                    The sign-in `GET /control/auth/login` started for
                    `keera login`, from the panel's address. Leave it out to
                    sign in to the panel.
                username:
                  type: string
                password:
                  type: string
                  format: password
                next:
                  type: string
                  description: A path on this site to go to afterwards.
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`keera_session`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The directory did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/passkey/options:
    post:
      operationId: passkeySignInOptions
      tags: [sign-in]
      summary: Start a passkey sign-in
      description: |
        Starts a new sign-in, or with `flow` continues the one
        `GET /control/auth/login` started for `keera login`. Must be sent as
        `application/json`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flow:
                  type: string
                next:
                  type: string
                  description: A path on this site to go to afterwards.
      responses:
        "200":
          description: What to call `navigator.credentials.get` with.
          content:
            application/json:
              schema:
                type: object
                required: [flow, options]
                properties:
                  flow:
                    type: string
                    description: Send it back with the answer.
                  options:
                    $ref: "#/components/schemas/RequestOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/passkey/sign-in:
    post:
      operationId: passkeySignIn
      tags: [sign-in]
      summary: Sign in with a passkey
      description: Each `flow` works once. Must be sent as `application/json`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [flow, credential]
              properties:
                flow:
                  type: string
                credential:
                  $ref: "#/components/schemas/Assertion"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`keera_session`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/passkey/setup/options:
    post:
      operationId: passkeySetupOptions
      tags: [sign-in]
      summary: Start adding a passkey from a set-up link
      description: |
        Nobody is signed in: the link's token is the credential. Using the
        options does not use up the link. Must be sent as `application/json`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  description: The part of the set-up link after `#passkey-setup=`.
      responses:
        "200":
          description: What to call `navigator.credentials.create` with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/passkey/setup:
    post:
      operationId: passkeySetup
      tags: [sign-in]
      summary: Add a passkey from a set-up link
      description: |
        Stores the passkey, uses up the link and signs the person in. Must be
        sent as `application/json`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, challenge_id, credential]
              properties:
                token:
                  type: string
                  description: The same token as for the options.
                challenge_id:
                  type: string
                name:
                  type: string
                  description: Defaults to "Passkey". Cut to 64 characters.
                credential:
                  $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`keera_session`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/signup:
    get:
      operationId: signupInfo
      tags: [sign-in]
      summary: Read the sign-up in progress
      description: |
        For a sign-in that matched no organisation, through a provider that
        allows sign-up. Says who signed in and who invited them.
      security: []
      parameters:
        - name: keera_signup
          in: cookie
          required: true
          description: Set by the callback.
          schema: { type: string }
      responses:
        "200":
          description: The sign-up.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
                  invited_org_name:
                    type: string
                    description: The organisation that added this address, if any.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: completeSignup
      tags: [sign-in]
      summary: Create or join an organisation
      description: |
        Creates a limited organisation with the person as its administrator,
        or joins the one that invited them, and signs them in. A name another
        organisation has gets the person's address added.
      security: []
      parameters:
        - name: keera_signup
          in: cookie
          required: true
          description: Set by the callback.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                join:
                  type: boolean
                  description: Join the inviting organisation instead of creating one.
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The new organisation's name. Needed unless `join` is true.
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`keera_session`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInRedirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/auth/logout:
    post:
      operationId: logout
      tags: [sign-in]
      summary: Sign out
      description: |
        Ends this session or CLI token. With `all=1`, ends every session and
        CLI token of this person, in every organisation.
      parameters:
        - name: all
          in: query
          description: "`1` to sign out everywhere."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears `keera_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [provider_logout_url]
                properties:
                  provider_logout_url:
                    type: string
                    description: The identity provider's own sign-out page, or empty.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/me:
    get:
      operationId: me
      tags: [me]
      summary: Who the caller is
      description: What the panel loads first. A session gets its CSRF token here.
      responses:
        "200":
          description: The caller and what this deployment offers.
          content:
            application/json:
              schema:
                type: object
                required:
                  - via
                  - user_id
                  - email
                  - name
                  - role
                  - org_id
                  - unrestricted
                  - can_admin_org
                  - csrf
                  - sso
                  - providers
                  - roles_from_directory
                  - gateway_url
                  - chat_url
                  - sandboxes
                  - billing
                  - payments
                  - claude_subscriptions
                  - passkeys
                  - passkey_account
                properties:
                  via:
                    type: string
                    enum: [operator_key, session, cli]
                  user_id:
                    type: string
                    description: Empty for the operator key.
                  email:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                    enum: [operator, admin, member]
                  org_id:
                    type: string
                    description: Empty for the operator key.
                  unrestricted:
                    type: boolean
                    description: Whether the caller is an operator.
                  can_admin_org:
                    type: boolean
                  csrf:
                    type: string
                    description: For `X-CSRF-Token`. Empty unless signed in with a session.
                  sso:
                    type: boolean
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignInProvider"
                  roles_from_directory:
                    type: boolean
                    description: Whether a directory group decides roles, so they cannot be changed here.
                  gateway_url:
                    type: string
                    description: Where clients send inference requests.
                  chat_url:
                    type: string
                    description: Keera Chat, or empty.
                  sandboxes:
                    type: boolean
                  billing:
                    type: boolean
                  payments:
                    type: boolean
                  claude_subscriptions:
                    type: boolean
                  passkeys:
                    type: boolean
                  passkey_account:
                    type: boolean
                    description: Whether the caller signs in with passkeys.
                  orgs:
                    type: array
                    description: The organisations to switch to, by name. Only when there is more than one.
                    items:
                      $ref: "#/components/schemas/Membership"
                  org_name:
                    type: string
                  org_limited:
                    type: boolean
                    description: Whether the organisation is limited, as after sign-up.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/me/org:
    post:
      operationId: switchOrg
      tags: [me]
      summary: Switch organisation
      description: |
        Moves the caller's session or CLI token to another of their
        organisations. Choosing one that invited them accepts the invitation.
        The operator key cannot switch; it names `org_id` on each request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org_id]
              properties:
                org_id:
                  type: string
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema:
                type: object
                required: [org_id, org_name, role]
                properties:
                  org_id:
                    type: string
                  org_name:
                    type: string
                  role:
                    type: string
                    enum: [operator, admin, member]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/access:
    get:
      operationId: access
      tags: [me]
      summary: My keys, limits and refusals
      description: |
        Only the caller's own keys, even for an administrator, with the
        limits above each and the refusals of the last week.
      responses:
        "200":
          description: The caller's access.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, gateway_url, keys, refusals]
                properties:
                  email:
                    type: string
                  role:
                    type: string
                    enum: [operator, admin, member]
                  gateway_url:
                    type: string
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessKey"
                  refusals:
                    type: array
                    description: The last 20 refused or failed requests, newest first.
                    items:
                      $ref: "#/components/schemas/Refusal"
                  anonymous:
                    type: boolean
                    description: True for the operator key, which has no keys.
                  operator_key:
                    type: boolean
                    description: True when signed in to the panel with the operator key.
                  org:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  used:
                    type: boolean
                    description: Whether any of the keys has ever been used.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/users:
    post:
      operationId: addUser
      tags: [tenancy]
      summary: Add a person
      description: |
        Places a person in an organisation before their first sign-in.
        Needs an administrator of the organisation. A passkey account comes
        with its first set-up link; an administrator can only create one at
        the organisation's email domain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                org_id:
                  type: string
                  description: Only an operator, who belongs to none, needs it.
                email:
                  type: string
                  format: email
                external_id:
                  type: string
                  description: |
                    `<provider>:<subject>`, such as `google:1234567890`. Only
                    an operator may set it; otherwise the person is linked at
                    their first sign-in.
                role:
                  type: string
                  enum: [admin, member]
                  default: member
                sign_in:
                  type: string
                  enum: [sso, passkey]
                  description: |
                    Defaults to `sso`, or `passkey` on a gateway with passkeys
                    and no identity provider.
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/User" }
                  - type: object
                    properties:
                      passkey_link:
                        $ref: "#/components/schemas/PasskeyLink"
                        description: Only for a passkey account.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      operationId: listUsers
      tags: [tenancy]
      summary: List people
      description: An operator who names no organisation sees everyone, by address.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/users/{id}:
    patch:
      operationId: updateUser
      tags: [tenancy]
      summary: Change a person's role
      description: |
        Needs an administrator of the person's organisation. Not allowed
        where a directory group decides roles, for an operator, or on
        yourself. Signs the person out, so the new role applies at once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum: [admin, member]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/users/{id}/disable:
    post:
      operationId: disableUser
      tags: [tenancy]
      summary: Turn a person off
      description: |
        For someone who left. Revokes their keys, ends their sessions,
        removes their passkeys and stops their sandboxes. Needs an
        administrator of their organisation; not for yourself or an operator.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Turned off.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, disabled, revoked_keys]
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  disabled:
                    type: boolean
                    const: true
                  revoked_keys:
                    type: integer
                  sandboxes:
                    type: object
                    description: Only where this deployment lends out sandboxes.
                    required: [terminated, suspended, failed]
                    properties:
                      terminated:
                        type: integer
                      suspended:
                        type: integer
                        description: An engineer's sandbox is kept, suspended.
                      failed:
                        type: integer
                  warning:
                    type: string
                    description: Set when some sandboxes could not be read or stopped.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/users/{id}/enable:
    post:
      operationId: enableUser
      tags: [tenancy]
      summary: Turn a person back on
      description: |
        They can sign in again. Their old keys stay revoked. Needs an
        administrator of their organisation; not for yourself or an operator.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Turned on.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, disabled]
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  disabled:
                    type: boolean
                    const: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/users/{id}/passkey-link:
    post:
      operationId: issuePasskeyLinkRoute
      tags: [tenancy]
      summary: Hand out a passkey set-up link
      description: |
        Replaces any earlier link. Turns a person who has not signed in yet
        into a passkey account. Needs an administrator of their organisation,
        and, for one, an address at the organisation's email domain.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The link. It is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/passkeys:
    get:
      operationId: listPasskeys
      tags: [tenancy]
      summary: List passkeys
      description: The caller's own, or with `user_id` someone the caller administers.
      parameters:
        - name: user_id
          in: query
          description: Needed with the operator key, which has no passkeys.
          schema: { type: string }
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/Disabled"
    post:
      operationId: addOwnPasskey
      tags: [tenancy]
      summary: Add a passkey to your account
      description: |
        Finishes what `POST /control/v1/passkeys/options` started. Only for a
        passkey account, in the panel, within 15 minutes of signing in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, credential]
              properties:
                challenge_id:
                  type: string
                name:
                  type: string
                  description: Defaults to "Passkey". Cut to 64 characters.
                credential:
                  $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/passkeys/options:
    post:
      operationId: ownPasskeyOptions
      tags: [tenancy]
      summary: Start adding a passkey to your account
      description: |
        For a second device. Only for a passkey account, in the panel, within
        15 minutes of signing in; otherwise the code is `sign_in_again` or
        `forbidden`. Takes no body.
      responses:
        "200":
          description: What to call `navigator.credentials.create` with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [tenancy]
      summary: Remove a passkey
      description: |
        Anyone may remove their own, but not their last. An administrator may
        remove anyone's in their organisation, which also signs that person
        out.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/orgs:
    post:
      operationId: createOrg
      tags: [tenancy]
      summary: Create an organisation
      description: |
        Only an operator may. The new organisation starts with the models and
        sandbox classes of the template files, and a project called `default`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                email_domain:
                  type: string
                  description: Places a first sign-in from this domain in this organisation.
                  examples: [example.com]
      responses:
        "201":
          description: The new organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
          description: The name or email domain belongs to another organisation (`org_name_taken`, `domain_taken`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      operationId: listOrgs
      tags: [tenancy]
      summary: List organisations
      description: An operator sees every organisation. Anyone else sees only their own.
      responses:
        "200":
          description: The organisations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/orgs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrg
      tags: [tenancy]
      summary: Change an organisation
      description: Only an operator may. Send at least one field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                email_domain:
                  type: string
                  description: An empty string clears it.
                limited:
                  type: boolean
                  description: false lifts the limit of an organisation that signed up.
      responses:
        "200":
          description: The organisation as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: The name or email domain belongs to another organisation (`org_name_taken`, `domain_taken`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteOrg
      tags: [tenancy]
      summary: Delete an organisation
      description: |
        Only an operator may, and not on the organisation they are signed in
        to. It removes the organisation's projects, users and keys. The request
        log, billing and audit log stay.
      responses:
        "200":
          description: What the delete removed.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, deleted, projects, users, keys]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  deleted:
                    type: boolean
                    const: true
                  projects:
                    type: integer
                    description: How many projects were removed.
                  users:
                    type: integer
                    description: How many users were removed.
                  keys:
                    type: integer
                    description: How many keys were removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: It still has live sandboxes (`org_has_sandboxes`). Terminate them first.
  /control/v1/projects:
    post:
      operationId: createProject
      tags: [tenancy]
      summary: Create a project
      description: Only an administrator of the organisation may.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                org_id:
                  type: string
                  description: |
                    The organisation. Only an operator needs it; everyone else
                    creates in their own.
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
      responses:
        "201":
          description: The new project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Another project in the organisation has that name (`project_name_taken`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      operationId: listProjects
      tags: [tenancy]
      summary: List projects
      description: |
        Each project comes with its guardrails and its spend this period. An
        operator who sends no `org_id` gets every organisation's projects.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The projects, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateProject
      tags: [tenancy]
      summary: Rename or describe a project
      description: Only an administrator of the organisation may. Send at least one field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  description: An empty string clears it.
      responses:
        "200":
          description: The project as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Another project in the organisation has that name (`project_name_taken`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteProject
      tags: [tenancy]
      summary: Delete a project
      description: |
        Only an administrator of the organisation may. Every key of the
        project must be revoked first. Revoked keys stay, with no project.
      responses:
        "200":
          description: The project is gone.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, deleted, detached_keys]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  deleted:
                    type: boolean
                    const: true
                  detached_keys:
                    type: integer
                    description: How many revoked keys stayed behind, now in no project.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            It still has keys that are not revoked (`project_has_keys`), or
            live sandboxes (`project_has_sandboxes`).
  /control/v1/keys:
    post:
      operationId: createKey
      tags: [keys]
      summary: Issue an API key
      description: |
        Only an administrator of the organisation may. The secret is in `key`
        and is shown only this once. A pending key has no secret yet: the
        person it is for gets one when they activate it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                org_id:
                  type: string
                  description: The organisation. Only an operator needs it.
                project_id:
                  type: string
                  description: Leave it out for the organisation's oldest project.
                user_id:
                  type: string
                  description: |
                    The person whose spend this is. Required for a
                    subscription key and for a pending key.
                name:
                  type: string
                  description: Defaults to `unnamed`.
                kind:
                  $ref: "#/components/schemas/KeyKind"
                expires_in_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Lifetime from now. Not with `expires_at`. Neither means it never expires.
                expires_at:
                  type: string
                  format: date-time
                  description: When it expires; must be in the future. Not with `expires_in_seconds`.
                pending:
                  type: boolean
                  description: Leave the key for the person named in `user_id` to activate.
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KeyInfo"
                  - type: object
                    properties:
                      key:
                        type: string
                        description: The secret. Shown only now. Absent for a pending key.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The person or project is not in this organisation.
        "409":
          $ref: "#/components/responses/Conflict"
          description: The organisation has no projects yet (`project_required`).
        "501":
          $ref: "#/components/responses/Disabled"
          description: A subscription key, while this deployment takes no Claude subscriptions (`subscriptions_disabled`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    get:
      operationId: listKeys
      tags: [keys]
      summary: List API keys
      description: Each key comes with its own guardrails, last use and spend since `since`.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: project_id
          in: query
          description: Only this project's keys.
          schema: { type: string }
        - name: since
          in: query
          description: |
            How far back to count spend, as a duration such as `24h`. The
            default is the start of this month (UTC). It is rounded down to
            midnight.
          schema:
            type: string
            examples: [168h]
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, since]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeySummary"
                  since:
                    type: string
                    format: date-time
                    description: Where the counts start.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: renameKey
      tags: [keys]
      summary: Rename an API key
      description: An administrator may, and so may a member for a key in their own name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: The new name.
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                  name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke an API key
      description: |
        An administrator may, and so may a member for a key in their own name.
        The key stays listed, revoked, so its usage still has a name.
      responses:
        "200":
          description: The key no longer works.
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id:
                    type: string
                  revoked:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: It was already revoked (`key_revoked`).
  /control/v1/keys/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rotateKey
      tags: [keys]
      summary: Rotate an API key
      description: |
        Issues a new key with the old one's project, person, kind and
        guardrails, and revokes the old one. An administrator may, and so may a
        member for a key in their own name, but only an administrator may set
        its lifetime. The secret is in `key` and is shown only this once.
      requestBody:
        required: true
        description: Send `{}` to keep the name and lifetime.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Empty keeps the old name.
                expires_in_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |
                    Lifetime from now. Not with `expires_at`. Neither gives the
                    new key the old one's lifetime, counted from now.
                expires_at:
                  type: string
                  format: date-time
                  description: When it expires; must be in the future.
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KeyInfo"
                  - type: object
                    required: [key, replaced_key_id]
                    properties:
                      key:
                        type: string
                        description: The secret. Shown only now.
                      replaced_key_id:
                        type: string
                        description: The old key, now revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            It is revoked (`key_revoked`), not yet activated (`key_pending`),
            or belongs to a sandbox (`sandbox_key`).
        "501":
          $ref: "#/components/responses/Disabled"
          description: A subscription key, while this deployment takes no Claude subscriptions (`subscriptions_disabled`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/keys/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: activateKey
      tags: [keys]
      summary: Activate a pending API key
      description: |
        Gives a pending key its secret. The person it is for may, and so may an
        administrator. The secret is in `key` and is shown only this once.
      requestBody:
        required: true
        description: Send `{}` to keep the name.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: A new name, such as the machine's. Empty keeps it.
      responses:
        "200":
          description: The key, now active.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KeyInfo"
                  - type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                        description: The secret. Shown only now.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            It is revoked (`key_revoked`), expired (`key_expired`) or already
            active (`key_active`).
        "501":
          $ref: "#/components/responses/Disabled"
          description: A subscription key, while this deployment takes no Claude subscriptions (`subscriptions_disabled`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/guardrails/{scope}/{id}:
    parameters:
      - name: scope
        in: path
        required: true
        description: The level the guardrail is on.
        schema: { $ref: "#/components/schemas/ScopeType" }
      - name: id
        in: path
        required: true
        description: The id of the organisation, project or key.
        schema: { type: string }
    get:
      operationId: getGuardrails
      tags: [guardrails]
      summary: Read a guardrail
      description: |
        What this one scope sets on its own. A scope with no guardrail answers
        an empty one. Anyone in the organisation may read it.
      responses:
        "200":
          description: The scope's own guardrail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limits"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putGuardrails
      tags: [guardrails]
      summary: Set a guardrail
      description: |
        Replaces the scope's guardrail with the body. Only an administrator of
        the organisation may. On an organisation, only an operator may change
        `allowed_repos`; an administrator who leaves it out keeps it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Limits"
      responses:
        "200":
          description: The guardrail as stored, cleaned up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limits"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            The guardrail is not valid, or names a filter or MCP server the
            organisation does not have (`filter_not_found`,
            `mcp_server_not_found`).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            An organisation's allow-list leaves out a model that one of its
            filters or routers runs on (`filter_model_not_allowed`,
            `router_model_not_allowed`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/guardrails/{scope}/{id}/effective:
    parameters:
      - name: scope
        in: path
        required: true
        description: The level the guardrail is on.
        schema: { $ref: "#/components/schemas/ScopeType" }
      - name: id
        in: path
        required: true
        description: The id of the organisation, project or key.
        schema: { type: string }
    get:
      operationId: effectiveGuardrails
      tags: [guardrails]
      summary: Read the guardrails that apply
      description: |
        Every level above the scope, and what they combine to, as the gateway
        combines them. It answers "why is this key refused". Anyone in the
        organisation may read it.
      responses:
        "200":
          description: The levels and their result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Effective"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/filters:
    get:
      operationId: listFilters
      tags: [filters]
      summary: List filters
      description: |
        Every member may read it, instructions included. With `stats=1` it also
        says what each filter did in the window.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: stats
          in: query
          description: '"1" adds `stats`, `from` and `to`.'
          schema: { type: string, enum: ["1"] }
        - name: from
          in: query
          description: Start of the stats window. Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the stats window. Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The organisation's filters.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Filter"
                  stats:
                    type: object
                    description: By alias. A filter that did not run is left out.
                    additionalProperties:
                      $ref: "#/components/schemas/FilterStat"
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/filters/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: Lowercase letters, digits and inner hyphens, up to 64.
        schema: { type: string }
    put:
      operationId: putFilter
      tags: [filters]
      summary: Create or replace a filter
      description: |
        Administrators only. A `rewrite` or `gate` filter needs `model` and
        `prompt`, and no `rules`. A `pattern` filter needs `rules`, and no
        `model` or `prompt`. See https://docs.keera.ch/manage/filters/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model:
                  type: string
                  description: |
                    The model the filter runs on: a chat model, or a decision
                    model for a gate. The organisation must allow it.
                mode:
                  type: string
                  enum: [rewrite, gate, pattern]
                  description: Empty or left out means rewrite.
                shadow:
                  type: boolean
                  description: Run, record, but enforce nothing. Left out means enforce.
                prompt:
                  type: string
                  maxLength: 16384
                  description: The instruction for the filter's model, up to 16 KiB.
                rules:
                  type: array
                  maxItems: 64
                  items:
                    $ref: "#/components/schemas/FilterRule"
                description:
                  type: string
      responses:
        "200":
          description: The filter as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteFilter
      tags: [filters]
      summary: Delete a filter
      description: |
        Administrators only. A filter that a router step or a guardrail still
        uses is refused with 409.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/filters/{alias}/check:
    post:
      operationId: checkFilter
      tags: [filters]
      summary: Run a filter over a sample
      description: |
        Administrators only. Sends a fixed sample through the filter and shows
        what came back. A filter that fails still answers 200, with `ok` false.
        It runs the filter's model, so it can cost money.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: What the check found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterProbe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/filters/{alias}/report:
    get:
      operationId: filterReport
      tags: [filters]
      summary: One filter's report
      description: |
        Every member may read it. A deleted filter keeps its report; then
        `filter` is left out.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [report, project_names]
                properties:
                  report:
                    $ref: "#/components/schemas/FilterReport"
                  filter:
                    $ref: "#/components/schemas/Filter"
                  project_names:
                    type: object
                    description: Project names by id.
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/routers:
    get:
      operationId: listRouters
      tags: [routers]
      summary: List routers
      description: |
        Every member may read it. With `stats=1` it also says what went
        through each router in the window.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: stats
          in: query
          description: '"1" adds `stats`, `from` and `to`.'
          schema: { type: string, enum: ["1"] }
        - name: from
          in: query
          description: Start of the stats window. Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the stats window. Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The organisation's routers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Router"
                  stats:
                    type: object
                    description: By alias. A router nobody called is left out.
                    additionalProperties:
                      $ref: "#/components/schemas/RouterStat"
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/routers/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: Lowercase letters, digits and inner hyphens, up to 64.
        schema: { type: string }
    put:
      operationId: putRouter
      tags: [routers]
      summary: Create or replace a router
      description: |
        Administrators only. The alias may not be one of the organisation's
        models (409). A new router is put on the organisation's allow-list,
        if it has one, unless the list leaves out a model the router reaches;
        `warning` then says so. See https://docs.keera.ch/manage/routers/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [start]
              properties:
                display_name:
                  type: string
                description:
                  type: string
                start:
                  $ref: "#/components/schemas/RouterStep"
      responses:
        "200":
          description: The router as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedRouter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteRouter
      tags: [routers]
      summary: Delete a router
      description: |
        Administrators only. It also comes off the organisation's allow-list.
        A router that a project's or key's allow-list still names is refused
        with 409.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/routers/{alias}/check:
    post:
      operationId: checkRouter
      tags: [routers]
      summary: Check a router's route steps
      description: |
        Administrators only. An instruction step is given sample prompts and
        shows where each went; the other modes ask their destinations whether
        they answer. It can cost money. A router with no route step, or no
        step named by `step`, answers 400.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OrgID"
        - name: step
          in: query
          description: Check only the route step with this id.
          schema: { type: string }
      responses:
        "200":
          description: One probe per route step checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/routers/{alias}/report:
    get:
      operationId: routerReport
      tags: [routers]
      summary: One router's report
      description: |
        Every member may read it. A deleted router keeps its report; then
        `router` is left out.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report:
                    $ref: "#/components/schemas/RouterReport"
                  router:
                    $ref: "#/components/schemas/Router"
                  limits:
                    type: array
                    description: |
                      How much of each budget and each rate limit per day or
                      month is used now, in the order of the steps. Left out with
                      `router`.
                    items:
                      $ref: "#/components/schemas/RouterLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List models
      description: |
        Anyone signed in may read it. Only the organisation's administrators
        see `backends` (`null` for everyone else) and `has_api_key`. With
        `stats=1` it adds each model's time to first token in the window.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: stats
          in: query
          description: '"1" adds `stats`, `from` and `to`.'
          schema: { type: string, enum: ["1"] }
        - name: from
          in: query
          description: Start of the stats window. Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the stats window. Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The organisation's models.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgModel"
                  stats:
                    type: object
                    description: By alias. A model with no answers is left out.
                    additionalProperties:
                      $ref: "#/components/schemas/ModelStat"
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/providers:
    get:
      operationId: listProviders
      tags: [models]
      summary: List hosted providers
      description: |
        The hosted providers this build knows, with their models and prices.
        Anyone signed in may read it; only an administrator sees `endpoint`
        (empty for everyone else).
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostedProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/models/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: |
          Lowercase letters, digits and inner hyphens, with optional slashes
          between parts, such as `anthropic/claude-sonnet-4-5`. Send a slash
          as `%2F`.
        schema: { type: string }
    put:
      operationId: putModel
      tags: [models]
      summary: Create or replace a model
      description: |
        Administrators only. A new model is put on the organisation's
        allow-list, if it has one. For a provider whose key the deployment
        holds, the backend and prices are set by the gateway and `api_key`
        must be left out. See https://docs.keera.ch/manage/models/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [backend_model]
              properties:
                kind:
                  type: string
                  enum: [chat, completion, embedding, decision]
                  description: Defaults to chat.
                backends:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: |
                    http or https base URLs, such as `http://vllm:8000/v1`. At
                    least one, unless the deployment holds the provider's key.
                backend_model:
                  type: string
                  description: The name the backend serves the model under.
                provider:
                  type: string
                  description: A hosted provider from `GET /control/v1/providers`, or empty for a self-served model.
                display_name:
                  type: string
                description:
                  type: string
                input_micros_per_mtok:
                  type: integer
                  format: int64
                  description: Micro-units per million input tokens.
                output_micros_per_mtok:
                  type: integer
                  format: int64
                  description: Micro-units per million output tokens.
                cached_input_micros_per_mtok:
                  type: integer
                  format: int64
                  description: 0 means the input price.
                cache_write_micros_per_mtok:
                  type: integer
                  format: int64
                  description: 0 means the input price.
                long_prompt:
                  $ref: "#/components/schemas/PriceTier"
                max_context_tokens:
                  type: integer
                release_date:
                  type: string
                  format: date
                  description: YYYY-MM-DD.
                location:
                  type: string
                  description: |
                    Where the model runs, such as `ch`, `usa` or `onprem`. Left
                    out, it comes from the provider or the backend address.
                subscription:
                  type: boolean
                  description: |
                    Paid by each caller's own Claude plan. Needs provider
                    `anthropic`, kind chat, and no `api_key`. See
                    https://docs.keera.ch/operate/claude-plans/.
                enabled:
                  type: boolean
                  description: Left out, a new model starts on and an existing one keeps its state.
                api_key:
                  type: string
                  writeOnly: true
                  description: |
                    The backend's credential. Left out keeps the stored one,
                    and "" removes it. Needed again when `backends` moves to
                    another host.
                alias:
                  type: string
                  description: Ignored; the path names the model.
                org_id:
                  type: string
                  description: Ignored.
                has_api_key:
                  type: boolean
                  description: Ignored.
                platform_key:
                  type: boolean
                  description: Ignored.
      responses:
        "200":
          description: The model as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/Disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteModel
      tags: [models]
      summary: Delete a model
      description: |
        Administrators only. It also comes off every allow-list in the
        organisation. A model a filter or a router step still uses is
        refused with 409.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/models/{alias}/check:
    post:
      operationId: checkModel
      tags: [models]
      summary: Check a model works
      description: |
        Administrators only. Calls the model's own backend with a tool and a
        question only that tool can answer. A model that fails still answers
        200, with `ok` false. It can cost money.
      parameters:
        - name: alias
          in: path
          required: true
          description: Send a slash as `%2F`.
          schema: { type: string }
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: What the check found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProbe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/mcp-servers:
    get:
      operationId: listMCPServers
      tags: [mcp-servers]
      summary: List MCP servers
      description: |
        Anyone in the organisation may read it. Only its administrators see
        `url` (empty for everyone else), `auth_header` and `has_api_key`.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The organisation's MCP servers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/mcp-servers/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: Lowercase letters, digits and inner hyphens, up to 64.
        schema: { type: string }
    put:
      operationId: putMCPServer
      tags: [mcp-servers]
      summary: Create or replace an MCP server
      description: Administrators only. See https://docs.keera.ch/manage/mcp/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: The server's Streamable HTTP endpoint, http or https.
                description:
                  type: string
                auth_header:
                  type: string
                  description: |
                    The header the credential goes in. Empty means
                    `Authorization`, as a bearer token; any other header gets
                    the credential as it is.
                enabled:
                  type: boolean
                  description: Left out, a new server starts on and an existing one keeps its state.
                api_key:
                  type: string
                  writeOnly: true
                  description: |
                    Left out keeps the stored one, and "" removes it. Needed
                    again when `url` moves to another host.
      responses:
        "200":
          description: The server as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteMCPServer
      tags: [mcp-servers]
      summary: Delete an MCP server
      description: |
        Administrators only. A server a guardrail's tool allow-list still
        names is refused with 409.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/tool-calls:
    get:
      operationId: toolCalls
      tags: [mcp-servers]
      summary: List tool calls
      description: |
        Administrators only, for one organisation. Newest first, a page at a
        time. With `summary=1` it adds up the calls of each tool instead,
        most called first, with no paging.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
        - name: key_id
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: string }
        - name: server
          in: query
          description: An MCP server's alias.
          schema: { type: string }
        - name: tool
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: Rows per page. Defaults to 100, at most 5000.
          schema: { type: integer, minimum: 0 }
        - name: before
          in: query
          description: The `next_before` of the previous page.
          schema: { type: integer, format: int64 }
        - name: summary
          in: query
          description: '"1" adds up the calls per tool.'
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The calls, or with `summary=1` the totals per tool.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Calls
                    required: [from, to, data]
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ToolCallRow" }
                      next_before:
                        type: integer
                        format: int64
                        description: Pass as `before` for the next page. Left out on an empty page.
                  - type: object
                    title: Summary
                    required: [from, to, data]
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ToolSummary" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/playground/chat:
    post:
      operationId: playgroundChat
      tags: [models]
      summary: Send a chat from the panel
      description: |
        Sends one OpenAI-shaped chat completion with one of the caller's own
        API keys, named by `key_id`. It goes through the same data plane as
        `POST /api/v1/chat/completions`: that key's guardrails, budgets and
        usage apply, and the answer is the same, streamed as server-sent
        events when the body asks for `stream`. The operator key cannot use
        it, nor can a subscription key.
      parameters:
        - name: key_id
          in: query
          required: true
          description: One of the caller's own API keys.
          schema: { type: string }
        - name: X-Keera-Client
          in: header
          description: |
            Only `keera-chat` is kept, and only from a CLI sign-in. Every
            other request is recorded as `keera-playground`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An OpenAI chat completion request.
              required: [model, messages]
              properties:
                model:
                  type: string
                  description: A model or router alias the key may call.
                messages:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
              additionalProperties: true
      responses:
        "200":
          description: The completion, as the inference API answers it.
          content:
            application/json:
              schema:
                type: object
                description: An OpenAI chat completion.
            text/event-stream:
              schema:
                type: string
                description: "OpenAI chat completion chunks, ending with `data: [DONE]`."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: The model is on the deployment's key and the organisation has no credit left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: The model's backend failed or could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/connect:
    get:
      operationId: listConnect
      tags: [connect]
      summary: List the clients to connect
      description: |
        The coding agents that can be pointed at this gateway, with their
        templates, and the gateway address to put in them. Anyone signed in
        may read it.
      responses:
        "200":
          description: The client catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [data, gateway_url]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectClient"
                  gateway_url:
                    type: string
                    format: uri
                    description: The inference API's base URL, as a browser reaches it.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/connect/render:
    post:
      operationId: renderConnect
      tags: [connect]
      summary: Fill in every client's configuration
      description: |
        Renders each client's block for the given models, the default first.
        No key is sent: a block that holds one carries `placeholder` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                models:
                  type: array
                  description: The models and routers the key may call, the default first.
                  items:
                    $ref: "#/components/schemas/ConnectModel"
      responses:
        "200":
          description: One rendered block per client.
          content:
            application/json:
              schema:
                type: object
                required: [data, placeholder]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [client, config, run]
                      properties:
                        client:
                          type: string
                          description: The client's id.
                        config:
                          type: string
                          description: The filled-in block.
                        run:
                          type: string
                          description: What to type once it is configured.
                  placeholder:
                    type: string
                    description: The text that stands in a block for the key.
                    examples: ["keera_sk_…"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /control/v1/clients:
    get:
      operationId: listClients
      tags: [connect]
      summary: List the caller's own clients
      description: |
        Which clients called with the caller's own keys in the window, and
        with which key, newest first. Even an administrator sees only their
        own. The window is widened to whole days. The operator key has no
        keys, so it gets an empty list and `anonymous`.
      parameters:
        - name: from
          in: query
          description: Defaults to 30 days ago.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`.
          schema: { type: string }
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, data]
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectedClient"
                  anonymous:
                    type: boolean
                    description: The caller is not a person, so has no keys.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/diagnostics:
    get:
      operationId: diagnostics
      tags:
        - reports
      summary: Check the deployment
      description: What a deployment is missing, as `keera doctor` shows it. Nothing is written. An administrator sees their organisation's checks; the deployment's own checks are only for operators.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: probe
          in: query
          description: "`1` also calls each enabled model. Only for the organisation's administrators, and needs one organisation."
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnosis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/setup:
    get:
      operationId: setup
      tags:
        - reports
      summary: Count what the deployment has
      description: For the panel's first-run steps. Without an organisation, an operator gets counts across all of them.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/overview:
    get:
      operationId: overview
      tags:
        - reports
      summary: Dashboard figures
      description: The dashboard in one call. Narrowed to a project, key, person or model, it is that thing's own screen. A member sees the whole organisation's, like an administrator.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
        - name: project_id
          in: query
          description: Only this project's requests.
          schema:
            type: string
        - name: key_id
          in: query
          description: Only this key's requests.
          schema:
            type: string
        - name: user_id
          in: query
          description: Only this person's requests.
          schema:
            type: string
        - name: alias
          in: query
          description: Only this model, as clients name it.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - overview
                  - project_names
                properties:
                  overview:
                    $ref: "#/components/schemas/Overview"
                  project_names:
                    type: object
                    additionalProperties:
                      type: string
                    description: Project names by id.
                  key_names:
                    type: object
                    additionalProperties:
                      type: string
                    description: Key names by id. Only on a narrowed overview.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/map:
    get:
      operationId: trafficMap
      tags:
        - reports
      summary: Traffic between clients and models
      description: "The deployment as a picture: the clients that called, every model of the organisation, and the traffic between them. A member sees only the traffic of their own keys."
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - from
                  - to
                  - gateway_url
                  - gateway
                  - clients
                  - models
                  - flows
                  - last_minute
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  gateway_url:
                    type: string
                    description: The inference API's address, for the middle of the drawing.
                  gateway:
                    $ref: "#/components/schemas/UsageCell"
                    description: Every request in the window.
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapClient"
                    description: Busiest first.
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapModel"
                    description: Every model of the organisation, busiest first.
                  flows:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapFlow"
                  last_minute:
                    type: array
                    items:
                      type: integer
                      format: int64
                    description: Requests finished in each of the last 60 seconds, the most recent second first.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/usage:
    get:
      operationId: usage
      tags:
        - reports
      summary: Usage report
      description: Requests, tokens and cost per group. Over more than two days it counts whole days, and `from` and `to` say so. A member sees the whole organisation's, like an administrator.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
        - name: group_by
          in: query
          description: What each row is. Default `model`.
          schema:
            type: string
            enum:
              - client
              - day
              - key
              - model
              - org
              - project
              - user
        - name: project_id
          in: query
          description: Only this project's requests.
          schema:
            type: string
        - name: key_id
          in: query
          description: Only this key's requests.
          schema:
            type: string
        - name: user_id
          in: query
          description: Only this person's requests.
          schema:
            type: string
        - name: alias
          in: query
          description: Only this model, as clients name it.
          schema:
            type: string
        - name: format
          in: query
          description: "`csv` answers a spreadsheet instead."
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: The report, or with `format=csv` a spreadsheet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReportLabels"
                  - type: object
                    required:
                      - from
                      - to
                      - data
                      - chart
                    properties:
                      from:
                        type: string
                        format: date-time
                      to:
                        type: string
                        format: date-time
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/UsageBucket"
                      chart:
                        $ref: "#/components/schemas/UsageChart"
                      client_names:
                        type: object
                        additionalProperties:
                          type: string
                        description: Client labels by client key. Only with `group_by=client`.
            text/csv:
              schema:
                type: string
                description: "Columns: the group's name, its id, requests, input_tokens, output_tokens, cost, org_id, from, to."
          headers:
            Content-Disposition:
              description: "With `format=csv`: an attachment and its file name."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/audit:
    get:
      operationId: audit
      tags:
        - reports
      summary: Audit log
      description: Who changed what, newest first. Administrators only. Without `from`, `to` or `since` it has no time window.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: actor
          in: query
          description: Only entries by this actor.
          schema:
            type: string
        - name: action
          in: query
          description: Only this action, such as `billing.topup`.
          schema:
            type: string
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
        - name: limit
          in: query
          description: Entries per page. Default 100, at most 5000.
          schema:
            type: integer
            minimum: 0
        - name: before
          in: query
          description: The `next_before` of the previous page.
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          description: "`csv` answers a spreadsheet of every matching entry instead, up to 5000."
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: The report, or with `format=csv` a spreadsheet.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  filters:
                    $ref: "#/components/schemas/AuditFacets"
                    description: First page only.
                  next_before:
                    type: integer
                    format: int64
                    description: Pass as `before` for the next page. Absent on an empty page.
            text/csv:
              schema:
                type: string
                description: "Columns: timestamp, actor, action, target_type, target_id, detail."
          headers:
            Content-Disposition:
              description: "With `format=csv`: an attachment and its file name."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/requests:
    get:
      operationId: requests
      tags:
        - reports
      summary: Request log
      description: One row per inference request, whatever happened to it. An administrator reads the whole organisation's; a member only the requests made with their own keys.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
        - name: project_id
          in: query
          description: Only this project's requests.
          schema:
            type: string
        - name: key_id
          in: query
          description: Only this key's requests.
          schema:
            type: string
        - name: user_id
          in: query
          description: Only this person's requests. A member may only name themselves.
          schema:
            type: string
        - name: alias
          in: query
          description: Only this model, as clients name it.
          schema:
            type: string
        - name: outcome
          in: query
          description: Only requests with this outcome. `unhappy` is everything that did not deliver.
          schema:
            type: string
            enum:
              - ok
              - unhappy
              - failed
              - refused
              - interrupted
        - name: status
          in: query
          description: One exact status, such as `402`, or a class, such as `5xx`. Anything else filters nothing.
          schema:
            type: string
            examples:
              - "402"
              - 5xx
        - name: request_id
          in: query
          description: One request, by the id the gateway answered with. It ignores the window.
          schema:
            type: string
        - name: sort
          in: query
          description: The order. Default `recent`, newest first.
          schema:
            type: string
            enum:
              - recent
              - cost
              - tokens
              - ttft
        - name: limit
          in: query
          description: Rows per page. Default 100, at most 5000.
          schema:
            type: integer
            minimum: 0
        - name: before
          in: query
          description: The `next_before` of the previous page. Paging works only in the default order.
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          description: "`csv` answers a spreadsheet of the whole filtered window instead, up to 5000 rows."
          schema:
            type: string
            enum:
              - csv
        - name: facets
          in: query
          description: "`1` adds `filters`, the values this window can be narrowed by. First page only."
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: The report, or with `format=csv` a spreadsheet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReportLabels"
                  - type: object
                    required:
                      - from
                      - to
                      - data
                    properties:
                      from:
                        type: string
                        format: date-time
                      to:
                        type: string
                        format: date-time
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RequestLogEntry"
                      outcomes:
                        $ref: "#/components/schemas/RequestOutcomes"
                        description: Counts over the whole window. First page only.
                      filters:
                        $ref: "#/components/schemas/RequestFacets"
                        description: With `facets=1`, first page only.
                      next_before:
                        type: integer
                        format: int64
                        description: Pass as `before` for the next page. Only in the default order, and absent on an empty page.
            text/csv:
              schema:
                type: string
                description: "Columns: timestamp, model, status, error, key, key_id, project, user, input_tokens, output_tokens, cost, latency_ms, ttft_ms, stream, estimated, canceled, note."
          headers:
            Content-Disposition:
              description: "With `format=csv`: an attachment and its file name."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/requests/stream:
    get:
      operationId: requestStream
      tags:
        - reports
      summary: Request log, live
      description: |-
        The rows `GET /control/v1/requests` returns, narrowed the same way, as they are written. The response stays open.

        Each batch is an event named `requests` whose `data` is a JSON object:

        - `data`: the new rows, newest first, at most 200 (`RequestLogEntry`).
        - `outcomes`: the counts over the window `since` gives (`RequestOutcomes`).
        - `next_after`: the newest id sent. Pass it as `after` to resume.
        - `project_names`, `key_names`, `user_names`, `user_full_names`: only when a row names something the earlier labels did not.

        An idle stream sends a `: keepalive` comment every 25 seconds. It ends when the server shuts down; reconnect with `after`.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: since
          in: query
          description: "The window the counts cover, as a duration back from now, such as `24h`. It moves with the clock. Default: 30 days."
          schema:
            type: string
            examples:
              - 24h
        - name: project_id
          in: query
          description: Only this project's requests.
          schema:
            type: string
        - name: key_id
          in: query
          description: Only this key's requests.
          schema:
            type: string
        - name: user_id
          in: query
          description: Only this person's requests. A member may only name themselves.
          schema:
            type: string
        - name: alias
          in: query
          description: Only this model, as clients name it.
          schema:
            type: string
        - name: outcome
          in: query
          description: Only requests with this outcome. `unhappy` is everything that did not deliver.
          schema:
            type: string
            enum:
              - ok
              - unhappy
              - failed
              - refused
              - interrupted
        - name: status
          in: query
          description: One exact status, such as `402`, or a class, such as `5xx`. Anything else filters nothing.
          schema:
            type: string
            examples:
              - "402"
              - 5xx
        - name: request_id
          in: query
          description: One request, by the id the gateway answered with. It ignores the window.
          schema:
            type: string
        - name: after
          in: query
          description: "The newest id the reader already has. Default: the end of the log."
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: A stream of server-sent events.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/sessions:
    get:
      operationId: sessions
      tags:
        - reports
      summary: Sessions
      description: The request log grouped into tasks. A member sees only the sessions of their own keys. See https://docs.keera.ch/monitor/requests-and-sessions/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
          description: "Start of the window. Default: 30 days before `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "End of the window. Default: now."
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: The window as a duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
        - name: project_id
          in: query
          description: Only this project's requests.
          schema:
            type: string
        - name: key_id
          in: query
          description: Only this key's requests.
          schema:
            type: string
        - name: user_id
          in: query
          description: Only this person's requests. A member may only name themselves.
          schema:
            type: string
        - name: alias
          in: query
          description: Only this model, as clients name it.
          schema:
            type: string
        - name: session_key
          in: query
          description: Only this conversation.
          schema:
            type: string
        - name: outcome
          in: query
          description: Only sessions holding a request with this outcome. `ok` keeps those where every request was served.
          schema:
            type: string
            enum:
              - ok
              - unhappy
              - failed
              - refused
              - interrupted
        - name: status
          in: query
          description: "How the session ended: the last request's status, such as `402`, or a class, such as `5xx`."
          schema:
            type: string
            examples:
              - "402"
              - 5xx
        - name: unhappy
          in: query
          description: "`1` is `outcome=unhappy`, for older `keera` commands."
          schema:
            type: string
            enum:
              - "1"
          deprecated: true
        - name: sort
          in: query
          description: The order. Default `recent`, newest first.
          schema:
            type: string
            enum:
              - recent
              - cost
              - tokens
              - requests
              - duration
        - name: limit
          in: query
          description: Rows per page. Default 100, at most 5000.
          schema:
            type: integer
            minimum: 0
        - name: before
          in: query
          description: The `next_before` of the previous page. Paging works only in the default order.
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          description: "`csv` answers a spreadsheet of the whole filtered window instead, up to 5000 sessions."
          schema:
            type: string
            enum:
              - csv
        - name: facets
          in: query
          description: "`1` adds `filters`, the values this window can be narrowed by. First page only."
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: The report, or with `format=csv` a spreadsheet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReportLabels"
                  - type: object
                    required:
                      - from
                      - to
                      - data
                      - gap_seconds
                    properties:
                      from:
                        type: string
                        format: date-time
                      to:
                        type: string
                        format: date-time
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgentSession"
                      gap_seconds:
                        type: integer
                        format: int64
                        description: The idle gap that cut these sessions.
                      totals:
                        $ref: "#/components/schemas/AgentSessionTotals"
                        description: Over the whole window. First page only.
                      filters:
                        $ref: "#/components/schemas/RequestFacets"
                        description: With `facets=1`, first page only.
                      next_before:
                        type: integer
                        format: int64
                        description: Pass as `before` for the next page. Only in the default order, and absent on an empty page.
            text/csv:
              schema:
                type: string
                description: "Columns: started, ended, minutes, requests, ok, failed, refused, interrupted, models, key, key_id, project, user, input_tokens, output_tokens, cost, last_status, last_error, session_id, named_by_client."
          headers:
            Content-Disposition:
              description: "With `format=csv`: an attachment and its file name."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/sessions/{id}:
    get:
      operationId: session
      tags:
        - reports
      summary: One session
      description: One task from start to end. A member sees it only if every request in it was made with their own keys.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of any request in the session.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReportLabels"
                  - type: object
                    required:
                      - session
                      - requests
                      - tool_calls
                      - gap_seconds
                    properties:
                      session:
                        $ref: "#/components/schemas/AgentSession"
                      requests:
                        type: array
                        items:
                          $ref: "#/components/schemas/RequestLogEntry"
                        description: Every request, in order.
                      tool_calls:
                        type: array
                        items:
                          $ref: "#/components/schemas/ToolCallRow"
                        description: The MCP tool calls in between, oldest first.
                      gap_seconds:
                        type: integer
                        format: int64
                        description: The idle gap that cut this session.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/billing:
    get:
      operationId: billing
      tags:
        - billing
      summary: Monthly bill
      description: One month of use of the deployment's own provider keys, per organisation and provider model, at list price. Administrators only. See https://docs.keera.ch/manage/billing/.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: month
          in: query
          description: "The month, in UTC. Default: the current one."
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
            examples:
              - 2026-09
        - name: format
          in: query
          description: "`csv` answers a spreadsheet instead."
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: The report, or with `format=csv` a spreadsheet.
          content:
            application/json:
              schema:
                type: object
                required:
                  - month
                  - from
                  - to
                  - data
                  - total
                  - payments
                properties:
                  month:
                    type: string
                    examples:
                      - 2026-09
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingRow"
                  total:
                    $ref: "#/components/schemas/BillingTotal"
                  payments:
                    type: boolean
                    description: Whether this deployment takes payments in advance.
            text/csv:
              schema:
                type: string
                description: "Columns: month, org_id, org_name, provider, model, calls, input_tokens, cached_input_tokens, cache_write_tokens, output_tokens, amount, and from_credit when the deployment takes payments."
          headers:
            Content-Disposition:
              description: "With `format=csv`: an attachment and its file name."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/billing/account:
    get:
      operationId: creditAccount
      tags:
        - billing
      summary: Credit account
      description: 'The organisation''s credit, its settings and its latest payments. Administrators only. It first looks up payments started in the last hour, so one just paid shows at once. On a deployment that takes no payments, it answers only `{"payments": false}`.'
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - payments
                properties:
                  payments:
                    type: boolean
                    description: Whether this deployment takes payments. Every other field is there only when it does.
                  vat_bp:
                    type: integer
                    format: int64
                    description: VAT added to every payment, in basis points.
                  fee_fixed_micros:
                    type: integer
                    format: int64
                    description: The fixed part of the transaction fee.
                  fee_bp:
                    type: integer
                    format: int64
                    description: The share of the credit added to the fee, in basis points.
                  fee_min_micros:
                    type: integer
                    format: int64
                    description: The least the share adds to the fee.
                  topup_min_micros:
                    type: integer
                    format: int64
                    description: The smallest payment.
                  topup_max_micros:
                    type: integer
                    format: int64
                    description: The largest payment.
                  account:
                    $ref: "#/components/schemas/CreditAccount"
                  recent:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
                    description: The latest 20 payments, newest first.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateCreditAccount
      tags:
        - billing
      summary: Change the automatic top-up
      description: Sets the automatic top-up, and for operators whether the organisation is billed by invoice. Administrators only. Changing the top-up clears why the last one failed.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topup_below_micros:
                  type: integer
                  format: int64
                  description: Below this balance the saved card is charged. Send with `topup_micros`; both 0 turn the top-up off.
                topup_micros:
                  type: integer
                  format: int64
                  description: What one top-up pays, from CHF 1 in whole centimes, and at least `topup_below_micros`.
                invoiced:
                  type: boolean
                  description: Bill by invoice, so no credit is needed. Operators only.
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/billing/account/card:
    delete:
      operationId: forgetCard
      tags:
        - billing
      summary: Remove the saved card
      description: Here and at PostFinance. The automatic top-up stops with it. Administrators only.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - org_id
                  - deleted
                properties:
                  org_id:
                    type: string
                  deleted:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/billing/topups:
    post:
      operationId: createTopUp
      tags:
        - billing
      summary: Pay for credit
      description: Starts a card payment and answers the payment page to send the person to. The credit is added once PostFinance says it is paid. VAT and a transaction fee come on top. Administrators only.
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount_micros
              properties:
                amount_micros:
                  type: integer
                  format: int64
                  description: The credit to buy, from CHF 1 to CHF 10,000, in whole centimes.
                save_card:
                  type: boolean
                  description: Save the card for automatic top-ups.
              additionalProperties: false
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required:
                  - payment
                  - url
                properties:
                  payment:
                    $ref: "#/components/schemas/Payment"
                    description: The pending payment. Its `created_at` is not filled in.
                  url:
                    type: string
                    format: uri
                    description: PostFinance Checkout's payment page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
        "502":
          description: PostFinance Checkout could not start the payment. Nothing was charged. The code is `payment_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /control/v1/billing/payments:
    get:
      operationId: listPayments
      tags:
        - billing
      summary: List payments
      description: Newest first. Administrators only; an operator without `org_id` sees every organisation's.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: limit
          in: query
          description: Payments per page. Default 50, at most 500.
          schema:
            type: integer
            minimum: 0
        - name: before
          in: query
          description: "The `next_before` of the previous page: a payment id."
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
                  next_before:
                    type: string
                    description: Pass as `before` for the next page. Absent on an empty page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /control/v1/billing/payments/{id}/receipt:
    get:
      operationId: paymentReceipt
      tags:
        - billing
      summary: Receipt of a payment
      description: The invoice PostFinance renders for a paid payment. Administrators only. A grant has none.
      parameters:
        - name: id
          in: path
          required: true
          description: The payment id.
          schema:
            type: string
      responses:
        "200":
          description: The receipt.
          headers:
            Content-Disposition:
              description: An attachment and its file name.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The payment has no receipt: it is a grant, or not paid. The code is `no_receipt`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
        "502":
          description: PostFinance Checkout did not hand out the receipt. The code is `receipt_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /control/v1/billing/grants:
    post:
      operationId: grantCredit
      tags:
        - billing
      summary: Grant credit
      description: "Adds credit without a payment, or takes some away: a trial, a refund, money that came by bank transfer. Operators only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
                - amount_micros
                - note
              properties:
                org_id:
                  type: string
                  description: The organisation to credit.
                amount_micros:
                  type: integer
                  format: int64
                  description: The credit to add, or below 0 to take away. Not 0, and at most CHF 10,000 either way.
                note:
                  type: string
                  description: Why. It shows in the organisation's payments.
              additionalProperties: false
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/billing/postfinance:
    post:
      operationId: postFinanceWebhook
      tags:
        - billing
      summary: PostFinance webhook
      description: "PostFinance Checkout says a transaction changed. The call proves nothing: the gateway only reads the transaction back over PostFinance's own API. Anything that is not one of its transactions is acknowledged and ignored. Throttled per address."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: integer
                  format: int64
                  description: The transaction id.
                listenerEntityTechnicalName:
                  type: string
                  examples:
                    - Transaction
                spaceId:
                  type: integer
                  format: int64
                  description: The PostFinance space.
      responses:
        "200":
          description: Handled or ignored. No body.
        "400":
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: This deployment takes no payments.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The transaction could not be read. PostFinance tries again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /healthz:
    get:
      operationId: healthz
      tags:
        - probes
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: ready
      tags:
        - probes
      summary: Readiness
      description: Ready when Postgres answers. The reason for a failure goes to the log, not the answer.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - usage_written
                  - usage_dropped
                properties:
                  status:
                    type: string
                    const: ok
                  usage_written:
                    type: integer
                    format: int64
                    description: Usage events this process has written.
                  usage_dropped:
                    type: integer
                    format: int64
                    description: Usage events this process has dropped.
        "503":
          description: The database did not answer.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
