      type: object
      required:
        - object
        - data
        - has_more
        - first_id
        - last_id
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/InferenceModel"
        has_more:
          type: boolean
          const: false
        first_id:
          type:
            - string
            - "null"
        last_id:
          type:
            - string
            - "null"
    JsonRpcMessage:
      type: object
      description: A JSON-RPC 2.0 request, notification or response.
      required:
        - jsonrpc
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type:
            - string
            - integer
            - "null"
        method:
          type: string
        params: {}
        result: {}
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}
  responses:
    BadRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid credential was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such thing, or the caller may not see it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: It clashes with something that is already there.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Over a limit. `Retry-After` says when to try again.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Disabled:
      description: This deployment has the feature turned off. The code ends in `_disabled`.
      content:
        application/json:
          schema:
