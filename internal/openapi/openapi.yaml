        - id
        - org_id
        - name
        - class
        - purpose
        - state
        - cpu_millis
        - memory_mib
        - disk_mib
        - created_at
        - running_seconds
      properties:
        id:
          type: string
          examples:
            - sbx_...
        org_id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        owner:
          type: string
          description: The address it was created for.
        name:
          type: string
        class:
          type: string
        purpose:
          $ref: "#/components/schemas/SandboxPurpose"
        state:
          $ref: "#/components/schemas/SandboxState"
        detail:
          type: string
          description: Why it is in its state, such as why it is still pending.
        image:
          type: string
        isolation:
          $ref: "#/components/schemas/SandboxIsolation"
        cpu_millis:
          type: integer
        memory_mib:
          type: integer
        disk_mib:
          type: integer
        key_id:
          type: string
          description: The API key minted for it.
        session_key:
          type: string
          description: An agent sandbox's session, so the two can be shown together.
        repo:
          type: string
        branch:
          type: string
        node:
          type: string
        backing:
          type: string
          enum:
            - sandbox
            - claim
          description: A machine of its own, or a claim on a warm pool.
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        suspended_at:
          type: string
          format: date-time
        terminated_at:
          type: string
          format: date-time
        running_seconds:
          type: integer
          description: How long it has actually held compute.
