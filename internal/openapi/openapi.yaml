                    additionalProperties: true
      responses:
        "200":
          description: The provider's answer, in this API's format.
          headers:
            X-Request-Id:
              description: "The request's id. One the client sent is kept if it is up to 64 of `A-Z a-z 0-9 . _ : -`."
              schema:
                type: string
            X-Keera-Model:
              description: The alias that answered; behind a router, the destination that answered.
              schema:
                type: string
            X-Keera-Router:
              description: The router and where it sent the request, as `router -> model`, with ` (fallback)` or ` (every destination failed)` when so.
              schema:
                type: string
            X-Keera-Filters:
              description: The filters that acted on the request, in order, comma-separated.
              schema:
                type: string
            X-Keera-Removed-Tools:
              description: Hosted tools taken out on the deployment's key.
              schema:
                type: string
            X-Keera-Removed-Fields:
              description: Fields taken out on the deployment's key.
              schema:
                type: string
            X-Keera-Budget-Remaining:
              description: What is left to spend at the tightest level with a budget, in CHF.
              schema:
                type: string
            X-Keera-Budget-Limit:
              description: That level's budget, in CHF.
              schema:
                type: string
            X-Keera-Budget-Reset:
              description: When that budget resets.
              schema:
                type: string
                format: date-time
            X-Keera-Budget-Scope:
              description: "The level: `org`, `project` or `key`."
              schema:
                type: string
                enum:
                  - org
                  - project
                  - key
            X-RateLimit-Limit-Requests:
              description: Requests per minute at the tightest level that limits them.
              schema:
                type: integer
            X-RateLimit-Remaining-Requests:
              description: Requests left in that bucket.
              schema:
                type: integer
            X-Keera-RateLimit-Scope:
              description: "The level: `org`, `project` or `key`."
              schema:
                type: string
                enum:
                  - org
                  - project
                  - key
            Retry-After:
              description: Passed on from the provider.
              schema:
                type: integer
            X-Should-Retry:
              description: Passed on from the provider.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
                description: "Server-sent events, when the request set `stream: true`."
        "400":
          description: The body or a field is not valid. Codes include `invalid_body`, `missing_model`, `context_length_exceeded` and `unsupported_parameter`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: "A budget is spent (`budget_exceeded`), or the organisation's prepaid credit for the deployment's provider keys is (`credit_exhausted`). Not 429: it does not lift by waiting."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Refused by a filter (`filter_refused`), a model the organisation may not use until it has paid (`org_limited`), or a subscription key while the deployment takes none (`subscriptions_off`).
          content:
            application/json:
