          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - expires_at
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
