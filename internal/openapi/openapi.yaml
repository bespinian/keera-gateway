              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/sandbox-usage:
    get:
      tags:
        - sandboxes
      operationId: sandboxUsage
      summary: Report sandbox usage
      description: Administrators only. Sandbox time grouped by class, project or person. A sandbox counts whole in the window it was created in. The window is the last 30 days unless `from`, `to` or `since` say otherwise.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: group_by
          in: query
          description: How to group. Defaults to `class`.
          schema:
            type: string
            enum:
              - class
              - project
              - user
            default: class
        - name: from
          in: query
          description: Start of the window, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the window, RFC 3339. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: A duration back from now, such as `24h`. `from` wins over it.
          schema:
            type: string
            examples:
              - 24h
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - group_by
                  - from
                  - to
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SandboxUsage"
                  group_by:
                    type: string
                    enum:
                      - class
                      - project
                      - user
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sandbox/v1/{ref}/tcp/{port}:
    get:
      tags:
        - sandboxes
      operationId: attachSandbox
      summary: Open a byte stream to a sandbox port
      description: |-
        An HTTP/1.1 upgrade, not JSON. The gateway authenticates the caller as the control API does, dials the port inside the sandbox, answers `101` and copies bytes both ways until one end stops. A connection idle for two hours is closed. Port 2222 is the sandbox's ssh server; `keera sandbox ssh` and `keera sandbox proxy` are the clients.

        Only the sandbox's owner or an operator may attach. An administrator can see and terminate a colleague's sandbox but not open it.
      parameters:
        - name: ref
          in: path
          required: true
          description: The sandbox's id (`sbx_...`) or its name. A name is unique only for one person in one organisation, so an operator naming one also passes `org_id`.
          schema:
            type: string
        - name: port
          in: path
          required: true
          description: An unprivileged port inside the sandbox. 2222 is ssh.
          schema:
            type: integer
            minimum: 1024
            maximum: 65535
            examples:
              - 2222
        - $ref: "#/components/parameters/OrgID"
        - name: Upgrade
          in: header
          required: true
          description: The protocol token. It is versioned, because the `keera` command may be older than the gateway.
          schema:
            type: string
            const: keera-sandbox/1
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
      responses:
        "101":
          description: Switching protocols. From here on the connection carries the port's raw bytes.
          headers:
            Upgrade:
              schema:
                type: string
                const: keera-sandbox/1
            Connection:
              schema:
                type: string
                const: Upgrade
        "400":
          description: The port is not between 1024 and 65535, or an operator named a sandbox without an organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The sandbox is somebody else's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox's state does not allow it, or the manager refused. The code is `sandbox_state`, `sandbox_not_ready` or `sandbox_ambiguous`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          description: The `Upgrade` header is missing or names another protocol (`upgrade_required`). A proxy in front may have stripped it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /sandbox/v1/git-credential:
    post:
      tags:
        - sandboxes
      operationId: gitCredential
      summary: Get a fresh repository credential
      description: |-
        Asked for by a sandbox, not a person: `git-credential-keera` calls it when the token it holds has five minutes left. It authenticates with the sandbox's own API key (`KEERA_API_KEY`) as a bearer token, so it stops working when the sandbox ends or its owner is disabled. The replaced token is revoked where the forge allows it. There is no request body.

        The answer is in the format git's credential helpers speak. It takes 10 requests a minute per client address on each replica.
      security:
        - bearer: []
      responses:
        "200":
          description: The credential, as `key=value` lines. `password_expiry_utc` is a Unix time, and only there when the token runs out.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/plain:
              schema:
                type: string
              example: |
                username=x-access-token
                password=ghs_...
                password_expiry_utc=1767225600
        "401":
          description: No key, or a key that belongs to no live sandbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Nothing to refresh: the sandbox has no repository, is not running or has run out of time (`sandbox_state`), or the forge gave no token (`no_git_credential`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/Disabled"
  /api/v1/chat/completions:
    post:
