          tool,
          calls,
          failed,
          denied,
          refused,
          latency_median_ms,
          arg_bytes,
          result_bytes,
        ]
      properties:
        server:
          type: string
        tool:
          type: string
        calls:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
          description: The tool's own failures and calls that got no result.
        denied:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        latency_median_ms:
          type: integer
          format: int64
        arg_bytes:
          type: integer
          format: int64
        result_bytes:
          type: integer
          format: int64
    ConnectClient:
