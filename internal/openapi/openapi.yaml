        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox's state does not allow it, or the manager refused. The code is `sandbox_state`, `sandbox_not_ready` or `sandbox_ambiguous`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/sandboxes/{ref}/resume:
    parameters:
      - name: ref
        in: path
