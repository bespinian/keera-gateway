      properties:
        above_tokens:
          type: integer
          minimum: 1
          description: The longest prompt still charged the model's own prices.
        input_micros_per_mtok:
          type: integer
          format: int64
        output_micros_per_mtok:
          type: integer
          format: int64
        cached_input_micros_per_mtok:
          type: integer
          format: int64
        cache_write_micros_per_mtok:
          type: integer
          format: int64
    ModelStat:
      type: object
      description: How fast a model has been answering.
      required: [ttft_median_ms, ttft_p95_ms]
      properties:
        ttft_median_ms:
          type: integer
          format: int64
        ttft_p95_ms:
          type: integer
          format: int64
    ModelProbe:
      type: object
      description: What one model check found.
      required: [alias, reachable, streamed, tool_calls, tool_call_as_text, ok]
      properties:
        alias:
          type: string
        backend:
          type: string
          description: The base URL that answered.
        reachable:
          type: boolean
        status:
          type: integer
        streamed:
          type: boolean
          description: The answer arrived as server-sent events.
        tool_calls:
          type: boolean
          description: The model's tool call came back in `tool_calls`.
        tool_call_as_text:
          type: boolean
          description: The tool call came back as prose, a parser mismatch.
        tools_off:
          type: boolean
          description: The backend refuses any request that offers tools.
        served_model:
          type: string
        ttft_ms:
          type: integer
          format: int64
        total_ms:
          type: integer
          format: int64
        sample:
          type: string
          description: The start of the prose that came back.
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
        no_credit:
          type: boolean
          description: On the deployment's key with no credit left, so not called.
        ok:
          type: boolean
    HostedProvider:
      type: object
      description: A hosted provider this build knows.
      required: [name, endpoint, cached_input, location, kinds, models, summary]
      properties:
        name:
          type: string
        endpoint:
          type: string
          description: |
            The OpenAI-compatible base URL, or a template holding
            `{product_id}`. Empty for anyone but an administrator.
        needs_product_id:
          type: boolean
          description: Each customer has their own endpoint.
        cached_input:
          type: boolean
          description: It publishes a cheaper rate for cached input.
        location:
          type: string
        kinds:
          type: array
          items:
