                $ref: "#/components/schemas/Error"
        "403":
          description: Refused by a filter (`filter_refused`), a model the organisation may not use until it has paid (`org_limited`), or a subscription key while the deployment takes none (`subscriptions_off`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such model, or the key may not use it (`model_not_found`). The message says where a model of another kind is served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is over the gateway's limit (`request_too_large`, 32 MiB by default), or too long for a filter's model (`filter_input_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: A `Content-Encoding` other than gzip or deflate (`unsupported_encoding`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: The model's backend could not be reached or gave an answer that could not be read (`upstream_unavailable`, `upstream_error`), or a filter failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No backend serves the model (`no_backend`), a router or filter could not decide, or the control plane is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Any other error status the model's provider gave, such as 504 or 529, passed on in the caller's error shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Anthropic's Messages API: the same chat models, routers and guardrails as chat completions, in Anthropic's format, translated where the model is not Anthropic's. Errors come in Anthropic's shape, with `type: error`.

        For a subscription model, Claude Code sends the caller's Claude sign-in in `Authorization` and the Keera key in `X-Keera-Key`; the gateway passes Anthropic's `anthropic-ratelimit-unified-*` headers back. See https://docs.keera.ch/operate/claude-plans/.
  /api/v1/messages/count_tokens:
