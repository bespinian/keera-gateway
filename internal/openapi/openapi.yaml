        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/sandboxes:
    get:
      tags:
        - sandboxes
      operationId: listSandboxes
      summary: List sandboxes
      description: A member sees only their own. An administrator sees the whole organisation's. Finished sandboxes are left out unless `all=1`.
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: project_id
          in: query
          description: Only this project's.
          schema:
            type: string
        - name: class
          in: query
          description: Only this class.
          schema:
            type: string
        - name: purpose
          in: query
          description: Only engineer or agent sandboxes.
          schema:
            $ref: "#/components/schemas/SandboxPurpose"
        - name: user_id
          in: query
          description: Only this person's. Administrators only; a member always gets their own.
          schema:
            type: string
        - name: all
          in: query
          description: Include finished sandboxes. Only `1` counts.
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Another organisation, or an account that is not a person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sandboxes
      operationId: createSandbox
      summary: Create a sandbox
      description: "The sandbox gets an API key of its own, in the project it lands in. A member cannot choose the project: it is the organisation's oldest. An organisation that signed itself up waits for its first payment. The answer comes before the machine is ready; its `state` is `pending`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - class
              additionalProperties: false
              properties:
                org_id:
                  type: string
                  description: Only an operator needs it.
                project_id:
                  type: string
                  description: Administrators only.
                name:
                  type: string
                  description: Lowercase letters, digits and interior hyphens. It becomes a hostname.
                class:
                  type: string
                purpose:
                  $ref: "#/components/schemas/SandboxPurpose"
                  description: Defaults to `engineer`.
                ttl_seconds:
                  type: integer
                  minimum: 1
                  description: The lifetime asked for. Left out, the class default. Above a ceiling, it is cut down, not refused.
                repo:
                  type: string
                  description: What to check out. An agent sandbox needs one.
                branch:
                  type: string
                task:
                  type: string
                  description: The instruction an agent sandbox starts on. It is never stored.
                authorized_keys:
                  type: array
                  items:
                    type: string
                  description: The ssh public keys that may open a shell. An engineer's sandbox needs at least one.
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Extra environment. It cannot name a `KEERA_` variable.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A member chose a project, or the organisation has not paid yet (`org_limited`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Refused: no such class, a name already in use, or over a quota (`sandbox_state`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/Disabled"
  /control/v1/sandboxes/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        description: The sandbox's id (`sbx_...`) or its name. A name is unique only for one person in one organisation, so an operator naming one also passes `org_id`.
        schema:
          type: string
    get:
      tags:
        - sandboxes
      operationId: getSandbox
      summary: Get a sandbox
      parameters:
