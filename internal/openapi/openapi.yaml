        org_id:
          type: string
          description: Only on a report across every organisation grouped by class.
        count:
          type: integer
        running_seconds:
          type: integer
        core_seconds:
          type: integer
          description: Running seconds weighted by CPU.
        live:
          type: integer
          description: How many still hold resources.
    InferenceModel:
      type: object
      description: A model or router, with the fields of both OpenAI's and Anthropic's model objects.
      required:
        - id
        - object
        - created
        - owned_by
        - type
        - display_name
      properties:
        id:
          type: string
          description: The alias to send as `model`.
        object:
          type: string
          const: model
        created:
          type: integer
          description: The release date as a Unix time, or 0.
        owned_by:
          type: string
          const: keera
        type:
          type: string
          const: model
        created_at:
          type: string
          format: date-time
          description: The release date, when one is stated.
        max_context_tokens:
          type: integer
        display_name:
          type: string
        description:
          type: string
        location:
          type: string
          description: Where prompts sent to it go.
        destinations:
          type: array
          items:
            type: string
          description: "Only on routers: every model it may send to."
