      operationId: countTokens
      summary: Count a message's tokens
      description: "Answered by the gateway from an estimate, never forwarded: forwarding would send the prompt to Anthropic without its filters. The estimate errs high and includes tools and the system prompts the guardrails and routers add. The model is checked as a real request would check it."
