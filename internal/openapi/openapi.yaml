    SandboxPurpose:
      type: string
      enum:
        - engineer
        - agent
      description: "`engineer` is a person's own machine, which people attach to and which is suspended when idle. `agent` is one task's machine, which nothing attaches to and which is terminated when its time runs out."
    SandboxState:
      type: string
      enum:
        - pending
        - ready
        - suspended
        - expired
        - failed
        - terminated
    SandboxClass:
      type: object
      description: A machine a developer or an agent can ask for by name.
      required:
        - org_id
        - name
        - image
        - isolation
        - cpu_millis
        - memory_mib
        - disk_mib
        - default_ttl_seconds
        - max_ttl_seconds
        - warm
        - created_at
        - updated_at
      properties:
        org_id:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: string
          description: The OCI image the sandbox runs.
        isolation:
          $ref: "#/components/schemas/SandboxIsolation"
        cpu_millis:
          type: integer
        memory_mib:
          type: integer
        disk_mib:
