# The linter set is named rather than left to the default, so the same commit
# gets the same answer next year: golangci-lint adds linters to its default set
# between releases.
#
# "standard" is errcheck, govet, ineffassign, staticcheck and unused. go vet
# runs separately through `make vet`, because it ships with the toolchain.
version: "2"

linters:
  default: standard

  exclusions:
    # generated: golangci-lint's own default, kept explicit because naming the
    # set above replaces the defaults rather than adding to them.
    generated: lax
    rules:
      # A test asserting on something it deliberately ignores - a status code
      # it is about to check by hand, a write to a recorder that cannot fail -
      # is noise, and wrapping each one would bury the line being tested.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
