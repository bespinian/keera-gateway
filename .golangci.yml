# The linter set is named, not left to the default, which grows between
# golangci-lint releases.
#
# "standard" is errcheck, govet, ineffassign, staticcheck and unused. govet is
# turned off here: `make vet` runs it, because it ships with the toolchain.
version: "2"

linters:
  default: standard
  disable:
    - govet

  exclusions:
    # golangci-lint's default, kept explicit because naming the set above
    # replaces the defaults.
    generated: lax
    rules:
      # Tests ignore errors on purpose, such as a write to a recorder that
      # cannot fail. Checking each would bury the line being tested.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
