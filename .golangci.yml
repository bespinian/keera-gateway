# The linter set is named, as the default grows between releases. "standard"
# is errcheck, govet, ineffassign, staticcheck and unused. govet is off here
# because `make vet` runs it.
version: "2"

linters:
  default: standard
  disable:
    - govet

  exclusions:
    # The default, kept explicit because naming the set replaces the defaults.
    generated: lax
    rules:
      # Tests ignore errors on purpose, such as a write that cannot fail.
      - path: _test\.go
        linters:
          - errcheck

# gofumpt is a stricter gofmt. `golangci-lint fmt` applies it.
formatters:
  enable:
    - gofumpt
